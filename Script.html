<script>
window.KEMIT_PRODUCTS = [{"id": "charbon-ecologique", "name": "KIKIMOUH Charbon écologique", "category": "Cuisson & énergie", "media": "product-charcoal", "short": "Combustible de biomasse conditionné pour les usages de cuisson, braise et chauffage.", "description": "Un produit KEMIT ECOLOGY issu de biomasses transformées et conditionné en plusieurs formats pour les besoins domestiques et professionnels.", "formats": [{"label": "2 kg", "price": "2 USD"}, {"label": "5 kg", "price": "5 USD"}, {"label": "10 kg", "price": "10 USD"}, {"label": "20 kg", "price": "15 USD"}, {"label": "40 kg", "price": "20 USD"}], "stock": "Capacité communiquée : jusqu’à 40 000 kg/mois, à confirmer au moment de la commande.", "delivery": "Cameroun, Afrique et international — sur confirmation logistique.", "usage": "Cuisson, braise, chauffage et autres usages compatibles avec le produit.", "composition": "Biomasses végétales et industrielles transformées.", "audience": "Ménages, restaurateurs, commerces et acheteurs professionnels.", "precautions": "Conserver à l’abri de l’eau et de l’humidité. Utiliser dans un équipement adapté et dans un espace correctement ventilé.", "conservation": "Stockage au sec et dans un espace aéré.", "professional": "Les besoins en gros volumes font l’objet d’une confirmation spécifique de disponibilité et de logistique.", "sceneMedia": "product-charcoal-scene", "sceneTitle": "Le charbon écologique en situation", "sceneText": "Une vue du produit dans un foyer permet de comprendre sa forme et son contexte d’utilisation sans transformer la fiche produit en promesse de performance."}, {"id": "biochar", "name": "Biochar Cameroon", "category": "Agriculture", "media": "photo-biochar", "short": "Amendement carboné destiné aux usages agricoles et à la gestion des sols.", "description": "Biochar KEMIT ECOLOGY conditionné pour les exploitations, projets agricoles et besoins professionnels.", "formats": [{"label": "25 kg", "price": "16 USD"}], "stock": "Disponibilité à confi ", "sceneTitle": "", "sceneText": ""}, {"id": "anti-poison", "name": "KIKIMOUH Charbon actif naturel", "category": "Bien-être", "media": "product-antipoison", "short": "Charbon actif naturel KIKIMOUH conditionné en petit format.", "description": "Produit à base de charbon actif naturel. Les usages spécifiques doivent être vérifiés sur l’étiquetage officiel et selon la réglementation applicable.", "formats": [{"label": "80 g", "price": "5 USD"}, {"label": "0,5 kg", "price": "8 USD"}, {"label": "1 kg", "price": "10 USD"}], "stock": "Disponibilité à confirmer.", "delivery": "Cameroun, Afrique et international — selon destination.", "usage": "Se référer à l’étiquetage du produit et aux conseils d’un professionnel compétent lorsque l’usage concerne la santé.", "composition": "Charbon actif naturel à base de coques de noix de coco, selon l’étiquetage fourni.", "audience": "Particuliers et distributeurs, selon la réglementation applicable.", "precautions": "Ne pas utiliser les informations du site comme conseil médical. Vérifier l’étiquette et demander un avis professionnel si nécessaire.", "conservation": "Conserver au sec, dans son emballage fermé.", "professional": "Distribution professionnelle sur confirmation.", "sceneMedia": "", "sceneTitle": "", "sceneText": ""}, {"id": "savon-charbon", "name": "Savon au charbon actif", "category": "Cosmétique", "media": "product-soap", "short": "Savon cosmétique au charbon actif pour l’hygiène et le nettoyage de la peau.", "description": "Savon KEMIT ECOLOGY au charbon actif, présenté comme un produit cosmétique de nettoyage et de soin courant.", "formats": [{"label": "70 g", "price": "2 USD"}], "stock": "Disponibilité à confirmer.", "delivery": "Cameroun, Afrique et Europe — selon destination.", "usage": "Utilisation cosmétique externe. Faire mousser, appliquer puis rincer.", "composition": "Charbon actif et ingrédients cosmétiques, dont beurre de karité selon les informations communiquées.", "audience": "Particuliers, revendeurs et distributeurs de produits cosmétiques.", "precautions": "Éviter le contact avec les yeux. En cas d’irritation, arrêter l’utilisation.", "conservation": "Conserver au sec et à l’abri d’une chaleur excessive.", "professional": "Commandes revendeurs sur demande.", "sceneMedia": "", "sceneTitle": "", "sceneText": ""}, {"id": "masque-charbon", "name": "Masque au charbon", "category": "Cosmétique", "media": "product-mask", "short": "Soin cosmétique au charbon destiné au nettoyage de la peau.", "description": "Produit cosmétique KEMIT ECOLOGY destiné à compléter une routine de nettoyage de la peau.", "formats": [{"label": "80 g", "price": "3 USD"}], "stock": "Disponibilité à confirmer.", "delivery": "International — selon faisabilité.", "usage": "Préparer et appliquer conformément aux indications du conditionnement, puis rincer.", "composition": "Préparation cosmétique au charbon.", "audience": "Particuliers et revendeurs de produits cosmétiques.", "precautions": "Éviter les yeux et arrêter l’utilisation en cas d’irritation. Vérifier l’étiquette du produit vendu.", "conservation": "Conserver fermé dans un endroit sec.", "professional": "Approvisionnement revendeurs à confirmer.", "sceneMedia": "", "sceneTitle": "", "sceneText": ""}];

(function () {
  "use strict";

  const WHATSAPP = "237678420995";
  let currentProduct = null;
  let selectedFormat = null;
  let activeFilter = "all";

  const pages = () => Array.from(document.querySelectorAll("[data-page]"));

  function hydrateImages(root) {
    (root || document).querySelectorAll("[data-media]").forEach(img => {
      const key = img.dataset.media;
      if (window.KEMIT_MEDIA && window.KEMIT_MEDIA[key]) {
        img.src = window.KEMIT_MEDIA[key];
      }
    });
  }


  // KEMIT MOTION V1 — HumbleClient-inspired
  let motionObserver = null;
  let motionInitialized = false;

  function registerMotion(root) {
    const scope = root || document;
    const generalSelectors = [
      ".hero-copy > .eyebrow",
      ".hero-copy > h1",
      ".hero-copy > .hero-lead",
      ".hero-actions",
      ".hero-meta",
      ".hero-photo",
      ".page-hero-grid > *",
      ".faq-hero > *",
      ".contact-hero > *",
      ".section-heading > *",
      ".small-photo-feature",
      ".editorial-copy",
      ".faq-group",
      ".contact-card",
      ".graphic-panel",
      ".home-story > *",
      ".dark-grid > *",
      ".product-detail-grid > *",
      ".product-info-grid > *",
      ".section > .shell > *",
      ".address-grid > *",
      ".catalog-toolbar > *",
      ".format-panel",
      ".order-inline > *",
      ".product-detail-copy > *",
      ".faq-group > h2",
      ".faq-group details"
    ];

    scope.querySelectorAll(generalSelectors.join(",")).forEach((el, index) => {
      el.classList.add("reveal-item");
      if (!el.style.getPropertyValue("--reveal-delay")) {
        el.style.setProperty("--reveal-delay", Math.min((index % 5) * 55, 220) + "ms");
      }
    });

    scope.querySelectorAll(".split-editorial").forEach(section => {
      const children = Array.from(section.children);
      if (children[0]) children[0].classList.add("reveal-item", "reveal-left");
      if (children[1]) {
        children[1].classList.add("reveal-item", "reveal-right");
        children[1].style.setProperty("--reveal-delay", "80ms");
      }
    });

    const staggerGroups = [
      ".activity-grid",
      ".product-grid",
      ".use-grid",
      ".steps-grid",
      ".process-strip",
      ".story-grid",
      ".zones-grid",
      ".three-values",
      ".contact-grid",
      ".address-grid",
      ".product-info-grid",
      ".format-options",
      ".faq-group"
    ];

    scope.querySelectorAll(staggerGroups.join(",")).forEach(group => {
      Array.from(group.children).forEach((child, index) => {
        child.classList.add("reveal-item");
        child.style.setProperty("--reveal-delay", Math.min(index * 75, 300) + "ms");
      });
    });

    if (!motionObserver) {
      scope.querySelectorAll(".reveal-item").forEach(el => el.classList.add("is-visible"));
      return;
    }

    scope.querySelectorAll(".reveal-item:not(.is-visible)").forEach(el => motionObserver.observe(el));
  }


  // KEMIT MOTION V2 — full-site sequencing and tilt
  let tiltInitialized = false;

  function enhanceMotionClasses(root) {
    const scope = root || document;
    scope.querySelectorAll(".app-page.is-active .section, .app-page.is-active .page-hero, .app-page.is-active .product-detail-hero").forEach(section => {
      const items = Array.from(section.querySelectorAll(".reveal-item"));
      items.forEach((el,index) => {
        if (!el.classList.contains("reveal-left") && !el.classList.contains("reveal-right")) {
          if (index % 4 === 1) el.classList.add("reveal-up");
          if (index % 4 === 2) el.classList.add("reveal-pop");
        }
        if (!el.style.getPropertyValue("--reveal-delay")) {
          el.style.setProperty("--reveal-delay", Math.min(index * 55,275) + "ms");
        }
      });
    });
  }

  function registerTiltTargets(root) {
    const scope = root || document;
    scope.querySelectorAll(".hero-photo .photo-mat, .page-feature .photo-mat, .page-hero-media, .product-detail-media, .graphic-panel")
      .forEach(el => el.classList.add("motion-tilt"));
  }

  function initTiltMotion() {
    if (tiltInitialized) return;
    tiltInitialized = true;
    const finePointer = window.matchMedia && window.matchMedia("(pointer:fine)").matches;
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!finePointer || reduced) return;

    document.addEventListener("pointermove", event => {
      const target = event.target.closest(".motion-tilt");
      if (!target) return;
      const rect = target.getBoundingClientRect();
      const px = Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width));
      const py = Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height));
      target.style.setProperty("--tilt-y",((px-.5)*4).toFixed(2)+"deg");
      target.style.setProperty("--tilt-x",((.5-py)*3).toFixed(2)+"deg");
    },{passive:true});

    document.addEventListener("pointerout", event => {
      const target = event.target.closest(".motion-tilt");
      if (!target || (event.relatedTarget && target.contains(event.relatedTarget))) return;
      target.style.setProperty("--tilt-x","0deg");
      target.style.setProperty("--tilt-y","0deg");
    });
  }

  function refreshMotion() {
    window.requestAnimationFrame(() => {
      const activePage = document.querySelector(".app-page.is-active");
      if (activePage) {
        registerMotion(activePage);
        enhanceMotionClasses(activePage);
        registerTiltTargets(activePage);
      }
    });
  }

  function initMotion() {
    if (motionInitialized) return;
    motionInitialized = true;

    const reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (!reduceMotion && "IntersectionObserver" in window) {
      motionObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("is-visible");
          motionObserver.unobserve(entry.target);
        });
      }, {
        threshold:0.12,
        rootMargin:"0px 0px -7% 0px"
      });
    }

    document.body.classList.add("motion-ready");

    const header = document.querySelector(".site-header");
    const syncHeader = () => {
      if (header) header.classList.toggle("is-scrolled", window.scrollY > 18);
    };
    syncHeader();
    window.addEventListener("scroll", syncHeader, {passive:true});

    initTiltMotion();
    refreshMotion();
  }

  function routeFromHash() {
    const raw = location.hash.replace(/^#/, "").trim();
    return raw || document.body.dataset.initialRoute || "home";
  }

  function showPage(route, updateHash) {
    let page = route.split("/")[0] || "home";
    let productId = route.split("/")[1] || "";

    if (!["home","boutique","produit","savoir-faire","histoire","livraison","faq","contact"].includes(page)) {
      page = "home";
      route = "home";
    }

    pages().forEach(el => el.classList.toggle("is-active", el.dataset.page === page));

    document.querySelectorAll(".main-nav [data-route]").forEach(a => {
      a.classList.toggle("is-current", a.dataset.route === page);
    });

    if (page === "produit") {
      if (!productId && currentProduct) productId = currentProduct.id;
      if (!productId) {
        showPage("boutique", true);
        return;
      }
      openProduct(productId, false);
    }

    if (updateHash && location.hash !== "#" + route) {
      history.pushState(null, "", "#" + route);
    }

    document.querySelector("[data-nav]")?.classList.remove("is-open");
    window.scrollTo({top:0, behavior:"smooth"});
    refreshMotion();
  }

  function productPrice(product) {
    return product.formats?.[0]?.price || "Sur demande";
  }

  function productCard(product) {
    return `
      <article class="product-card" data-category="${escapeHtml(product.category)}">
        <div class="product-card-media">
          <img src="${window.KEMIT_MEDIA[product.media] || ""}" alt="${escapeHtml(product.name)}" loading="lazy">
        </div>
        <div class="product-card-body">
          <span class="product-card-category">${escapeHtml(product.category)}</span>
          <h3>${escapeHtml(product.name)}</h3>
          <p>${escapeHtml(product.short)}</p>
          <div class="product-card-footer">
            <span class="price-from">Dès ${escapeHtml(productPrice(product))}</span>
            <button class="card-link" type="button" data-product-id="${product.id}">Voir le produit →</button>
          </div>
        </div>
      </article>
    `;
  }

  function renderCatalog() {
    const grid = document.querySelector("[data-product-grid]");
    if (!grid) return;
    const items = activeFilter === "all"
      ? window.KEMIT_PRODUCTS
      : window.KEMIT_PRODUCTS.filter(p => p.category === activeFilter);
    grid.innerHTML = items.map(productCard).join("");
    registerMotion(grid);
  }

  function renderRelated(product) {
    const grid = document.querySelector("[data-related-products]");
    if (!grid) return;
    const others = window.KEMIT_PRODUCTS.filter(p => p.id !== product.id).slice(0,3);
    grid.innerHTML = others.map(productCard).join("");
    registerMotion(grid);
  }

  function openProduct(id, updateHash=true) {
    const product = window.KEMIT_PRODUCTS.find(p => p.id === id);
    if (!product) return;
    currentProduct = product;
    selectedFormat = product.formats?.[0] || null;

    setText("[data-product-category]", product.category);
    setText("[data-product-name]", product.name);
    setText("[data-product-description]", product.description);
    setText("[data-product-usage]", product.usage);
    setText("[data-product-composition]", product.composition);
    setText("[data-product-audience]", product.audience);
    setText("[data-product-stock]", product.stock);
    setText("[data-product-conservation]", product.conservation);
    setText("[data-product-precautions]", product.precautions);
    setText("[data-product-professional]", product.professional);

    const img = document.querySelector("[data-product-image]");
    if (img) {
      img.src = window.KEMIT_MEDIA[product.media] || "";
      img.alt = product.name;
    }

    const formats = document.querySelector("[data-product-formats]");
    if (formats) {
      formats.innerHTML = product.formats.map((f,i) => `
        <button class="format-chip ${i===0 ? "is-selected":""}" type="button" data-format-index="${i}">
          ${escapeHtml(f.label)} · ${escapeHtml(f.price)}
        </button>
      `).join("");
    }

    const scene = document.querySelector("[data-product-scene]");
    if (scene && product.sceneMedia && window.KEMIT_MEDIA[product.sceneMedia]) {
      scene.hidden = false;
      const simg = scene.querySelector("[data-product-scene-image]");
      if (simg) {
        simg.src = window.KEMIT_MEDIA[product.sceneMedia];
        simg.alt = product.name + " — contexte réel";
      }
      setText("[data-product-scene-title]", product.sceneTitle);
      setText("[data-product-scene-text]", product.sceneText);
    } else if (scene) {
      scene.hidden = true;
    }

    renderRelated(product);

    pages().forEach(el => el.classList.toggle("is-active", el.dataset.page === "produit"));
    if (updateHash) history.pushState(null, "", "#produit/" + product.id);
    window.scrollTo({top:0, behavior:"smooth"});
    refreshMotion();
  }

  function setText(selector, value) {
    const el = document.querySelector(selector);
    if (el) el.textContent = value || "";
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function whatsappOrder() {
    if (!currentProduct) return;
    const qty = document.querySelector("[data-order-qty]")?.value || "1";
    const dest = document.querySelector("[data-order-destination]")?.value.trim() || "À préciser";
    const format = selectedFormat
      ? `${selectedFormat.label} — ${selectedFormat.price}`
      : "À confirmer";

    const message =
`Bonjour KEMIT ECOLOGY,

Je souhaite commander :
Produit : ${currentProduct.name}
Format : ${format}
Quantité : ${qty}
Destination : ${dest}

Merci de me confirmer la disponibilité, le total, le paiement et la livraison.`;

    window.open("https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(message), "_blank", "noopener");
  }

  document.addEventListener("click", e => {
    const routeEl = e.target.closest("[data-route]");
    if (routeEl) {
      const route = routeEl.dataset.route;
      if (route && route !== "produit") {
        e.preventDefault();
        showPage(route, true);
        return;
      }
    }

    const productEl = e.target.closest("[data-product-id]");
    if (productEl) {
      e.preventDefault();
      openProduct(productEl.dataset.productId, true);
      return;
    }

    const filterEl = e.target.closest("[data-filter]");
    if (filterEl) {
      activeFilter = filterEl.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach(x => x.classList.toggle("is-selected", x === filterEl));
      renderCatalog();
      return;
    }

    if (e.target.closest("[data-filter-reset]")) {
      activeFilter = "all";
      document.querySelectorAll("[data-filter]").forEach(x => x.classList.remove("is-selected"));
      renderCatalog();
      return;
    }

    const formatEl = e.target.closest("[data-format-index]");
    if (formatEl && currentProduct) {
      const index = Number(formatEl.dataset.formatIndex);
      selectedFormat = currentProduct.formats[index] || currentProduct.formats[0];
      document.querySelectorAll("[data-format-index]").forEach(x => x.classList.toggle("is-selected", x === formatEl));
      return;
    }

    if (e.target.closest("[data-whatsapp-order]")) {
      whatsappOrder();
      return;
    }

    if (e.target.closest("[data-nav-toggle]")) {
      document.querySelector("[data-nav]")?.classList.toggle("is-open");
    }
  });

  window.addEventListener("hashchange", () => showPage(routeFromHash(), false));

  document.addEventListener("DOMContentLoaded", () => {
    hydrateImages();
    renderCatalog();
    initMotion();

    document.querySelectorAll("[data-year]").forEach(el => el.textContent = new Date().getFullYear());

    document.querySelectorAll("[data-whatsapp-generic]").forEach(a => {
      a.href = "https://wa.me/" + WHATSAPP + "?text=" +
        encodeURIComponent("Bonjour KEMIT ECOLOGY, je souhaite vous contacter au sujet de vos produits ou services.");
      a.target = "_blank";
      a.rel = "noopener";
    });

    const route = routeFromHash();
    showPage(route, false);
  });
})();
</script>

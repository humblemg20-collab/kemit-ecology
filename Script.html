<script>

(function () {

  "use strict";


  var SPA_PAGES = [
    "home",
    "boutique",
    "produit",
    "savoir-faire",
    "histoire",
    "livraison",
    "faq",
    "contact"
  ];


  var currentSpaPage =
    null;


  var currentProductId =
    null;


  document.addEventListener(
    "DOMContentLoaded",
    function () {

      hydraterImages();

      initialiserNavigation();

      initialiserProduits();

      initialiserFiltresBoutique();

      initialiserCommandes();

      initialiserSPA();

    }
  );



  /* =========================================================
     MEDIA
  ========================================================= */

  function hydraterImages() {

    document
      .querySelectorAll(
        "[data-media]"
      )
      .forEach(
        function (image) {

          var key =
            image.getAttribute(
              "data-media"
            );


          if (
            window.KEMIT_MEDIA &&
            window.KEMIT_MEDIA[key]
          ) {

            image.src =
              window.KEMIT_MEDIA[key];

          }

        }
      );

  }



  /* =========================================================
     SPA
  ========================================================= */

  function initialiserSPA() {

    var initialPage =
      normaliserSpaPage(
        window.KEMIT_INITIAL_PAGE ||
        recupererRouteDepuisHash().page ||
        "home"
      );


    var initialProductId =
      window.KEMIT_INITIAL_PRODUCT_ID ||
      recupererRouteDepuisHash().productId ||
      "";


    if (
      initialPage === "produit" &&
      initialProductId
    ) {

      ouvrirProduit(
        initialProductId,
        false
      );

      return;

    }


    afficherPage(
      initialPage,
      null,
      false
    );


    window.addEventListener(
      "hashchange",
      function () {

        var route =
          recupererRouteDepuisHash();


        if (
          route.page === "produit" &&
          route.productId
        ) {

          ouvrirProduit(
            route.productId,
            false
          );

          return;

        }


        if (
          route.page &&
          route.page !== currentSpaPage
        ) {

          afficherPage(
            route.page,
            null,
            false
          );

        }

      }
    );

  }



  function afficherPage(
    page,
    scrollTarget,
    updateHistory
  ) {

    page =
      normaliserSpaPage(
        page
      );


    document
      .querySelectorAll(
        "[data-page]"
      )
      .forEach(
        function (element) {

          var active =
            element.getAttribute(
              "data-page"
            ) === page;


          element.hidden =
            !active;


          element.setAttribute(
            "aria-hidden",
            active
              ? "false"
              : "true"
          );

        }
      );


    currentSpaPage =
      page;


    mettreAJourNavigation(
      page
    );


    fermerMenu();


    if (updateHistory) {

      history.pushState(
        null,
        "",
        "#" + page
      );

    }


    if (scrollTarget) {

      requestAnimationFrame(
        function () {

          var target =
            document.getElementById(
              scrollTarget
            );


          if (target) {

            target.scrollIntoView({
              behavior: "smooth",
              block: "start"
            });

          }

        }
      );

    } else {

      window.scrollTo({
        top: 0,
        behavior: "auto"
      });

    }


    mettreAJourTitre(
      page
    );

  }



  function ouvrirProduit(
    productId,
    updateHistory
  ) {

    var product =
      getProduct(
        productId
      );


    if (!product) {

      afficherPage(
        "boutique",
        null,
        updateHistory
      );

      return;

    }


    currentProductId =
      product.id;


    remplirFicheProduit(
      product
    );


    afficherPage(
      "produit",
      null,
      false
    );


    if (updateHistory) {

      history.pushState(
        null,
        "",
        "#produit/" +
        encodeURIComponent(
          product.id
        )
      );

    }


    document.title =
      product.name +
      " — KEMIT ECOLOGY";

  }



  function recupererRouteDepuisHash() {

    var hash =
      window.location.hash
        .replace(
          /^#/,
          ""
        )
        .trim();


    if (!hash) {

      return {
        page: "",
        productId: ""
      };

    }


    var parts =
      hash.split("/");


    return {

      page:
        normaliserSpaPage(
          parts[0]
        ),


      productId:
        parts[0] === "produit"
          ? decodeURIComponent(
              parts[1] || ""
            )
          : ""

    };

  }



  function normaliserSpaPage(page) {

    page =
      String(
        page || ""
      )
      .trim()
      .toLowerCase();


    return SPA_PAGES.indexOf(
      page
    ) !== -1
      ? page
      : "home";

  }



  function mettreAJourNavigation(page) {

    document
      .querySelectorAll(
        "[data-route]"
      )
      .forEach(
        function (link) {

          var route =
            link.getAttribute(
              "data-route"
            );


          link.classList.toggle(
            "is-active",
            route === page ||
            (
              page === "produit" &&
              route === "boutique"
            )
          );

        }
      );

  }



  function mettreAJourTitre(page) {

    var titles = {

      home:
        "KEMIT ECOLOGY — Nous produisons l’énergie de demain aujourd’hui",

      boutique:
        "Boutique — KEMIT ECOLOGY",

      produit:
        "Produit — KEMIT ECOLOGY",

      "savoir-faire":
        "Notre savoir-faire — KEMIT ECOLOGY",

      histoire:
        "Notre histoire — KEMIT ECOLOGY",

      livraison:
        "Livraison — KEMIT ECOLOGY",

      faq:
        "FAQ — KEMIT ECOLOGY",

      contact:
        "Contact — KEMIT ECOLOGY"

    };


    document.title =
      titles[page] ||
      titles.home;

  }



  /* =========================================================
     NAVIGATION
  ========================================================= */

  function initialiserNavigation() {

    document
      .addEventListener(
        "click",
        function (event) {

          var productLink =
            event.target.closest(
              "[data-product-id]"
            );


          if (productLink) {

            event.preventDefault();


            ouvrirProduit(
              productLink.getAttribute(
                "data-product-id"
              ),
              true
            );


            return;

          }


          var routeLink =
            event.target.closest(
              "[data-route]"
            );


          if (!routeLink) {

            return;

          }


          event.preventDefault();


          afficherPage(
            routeLink.getAttribute(
              "data-route"
            ),
            routeLink.getAttribute(
              "data-scroll-target"
            ),
            true
          );

        }
      );


    var toggle =
      document.querySelector(
        "[data-nav-toggle]"
      );


    if (toggle) {

      toggle.addEventListener(
        "click",
        function () {

          var nav =
            document.querySelector(
              "[data-nav]"
            );


          if (!nav) {
            return;
          }


          var open =
            nav.classList.toggle(
              "is-open"
            );


          toggle.setAttribute(
            "aria-expanded",
            open
              ? "true"
              : "false"
          );

        }
      );

    }

  }



  function fermerMenu() {

    var nav =
      document.querySelector(
        "[data-nav]"
      );


    var toggle =
      document.querySelector(
        "[data-nav-toggle]"
      );


    if (nav) {

      nav.classList.remove(
        "is-open"
      );

    }


    if (toggle) {

      toggle.setAttribute(
        "aria-expanded",
        "false"
      );

    }

  }



  /* =========================================================
     PRODUITS
  ========================================================= */

  function initialiserProduits() {

    document
      .querySelectorAll(
        "[data-product-grid]"
      )
      .forEach(
        function (grid) {

          renderProductGrid(
            grid
          );

        }
      );

  }



  function renderProductGrid(grid) {

    grid.innerHTML =
      window.KEMIT_PRODUCTS
        .map(
          productCardHtml
        )
        .join("");

  }



  function productCardHtml(product) {

    var media =
      (
        window.KEMIT_MEDIA &&
        window.KEMIT_MEDIA[
          product.media
        ]
      ) || "";


    var featured =
      product.featured
        ? '<span class="featured">Produit vedette</span>'
        : '';


    var offers =
      product.formats
        .map(
          function (offer) {

            return (
              '<div class="offer-row">' +
                '<span>' +
                  escapeHtml(
                    offer[0]
                  ) +
                '</span>' +
                '<strong>' +
                  escapeHtml(
                    offer[1]
                  ) +
                '</strong>' +
              '</div>'
            );

          }
        )
        .join("");


    return (

      '<article ' +
        'class="product-card" ' +
        'data-product-category="' +
          escapeHtml(
            product.category
          ) +
        '"' +
      '>' +

        '<div class="product-visual">' +

          featured +

          '<img ' +
            'src="' +
              media +
            '" ' +
            'alt="' +
              escapeHtml(
                product.name
              ) +
            '" ' +
            'loading="lazy"' +
          '>' +

        '</div>' +


        '<div class="product-copy">' +

          '<p class="product-category">' +
            escapeHtml(
              product.category
            ) +
          '</p>' +

          '<h3>' +
            escapeHtml(
              product.name
            ) +
          '</h3>' +

          '<p class="product-desc">' +
            escapeHtml(
              product.description
            ) +
          '</p>' +

          '<div class="offers">' +

            '<span class="offers-title">' +
              'Formats &amp; prix' +
            '</span>' +

            offers +

          '</div>' +

          '<div class="product-actions">' +

            '<a ' +
              'href="#produit/' +
                encodeURIComponent(
                  product.id
                ) +
              '" ' +
              'data-product-id="' +
                escapeHtml(
                  product.id
                ) +
              '"' +
            '>' +
              'Voir le produit' +
            '</a>' +

            '<button ' +
              'class="js-order" ' +
              'type="button" ' +
              'data-product="' +
                escapeHtml(
                  product.name
                ) +
              '"' +
            '>' +
              'Commander' +
            '</button>' +

          '</div>' +

        '</div>' +

      '</article>'

    );

  }



  function remplirFicheProduit(product) {

    var image =
      document.querySelector(
        "[data-product-image]"
      );


    if (image) {

      image.src =
        (
          window.KEMIT_MEDIA &&
          window.KEMIT_MEDIA[
            product.media
          ]
        ) || "";


      image.alt =
        product.name;

    }


    setText(
      "[data-product-category]",
      product.category
    );


    setText(
      "[data-product-name]",
      product.name
    );


    setText(
      "[data-product-description]",
      product.description
    );


    setText(
      "[data-product-stock]",
      product.stock
    );


    setText(
      "[data-product-delivery]",
      product.delivery
    );


    setText(
      "[data-product-usage]",
      product.usage
    );


    setText(
      "[data-product-composition]",
      product.composition
    );


    setText(
      "[data-product-audience]",
      product.audience
    );


    setText(
      "[data-product-precautions]",
      product.precautions
    );


    setText(
      "[data-product-conservation]",
      product.conservation
    );


    setText(
      "[data-product-ordering]",
      product.howToOrder
    );


    setText(
      "[data-product-professional]",
      product.professional
    );


    remplirProduitsAssocies(
      product.id
    );


    remplirSceneProduit(
      product
    );


    var offers =
      document.querySelector(
        "[data-product-offers]"
      );


    if (offers) {

      offers.innerHTML =
        '<span class="offers-title">' +
          'Formats &amp; prix' +
        '</span>' +

        product.formats
          .map(
            function (offer) {

              return (
                '<div class="offer-row">' +
                  '<span>' +
                    escapeHtml(
                      offer[0]
                    ) +
                  '</span>' +
                  '<strong>' +
                    escapeHtml(
                      offer[1]
                    ) +
                  '</strong>' +
                '</div>'
              );

            }
          )
          .join("");

    }


    var orderButton =
      document.querySelector(
        "[data-product-order]"
      );


    if (orderButton) {

      orderButton.setAttribute(
        "data-product",
        product.name
      );

    }

  }



  function remplirSceneProduit(product) {

    var section =
      document.querySelector(
        "[data-product-scene]"
      );

    if (!section) {
      return;
    }

    if (
      !product.sceneMedia ||
      !window.KEMIT_MEDIA ||
      !window.KEMIT_MEDIA[product.sceneMedia]
    ) {
      section.hidden = true;
      return;
    }

    section.hidden = false;

    var image =
      section.querySelector(
        "[data-product-scene-image]"
      );

    var title =
      section.querySelector(
        "[data-product-scene-title]"
      );

    var text =
      section.querySelector(
        "[data-product-scene-text]"
      );

    if (image) {
      image.src =
        window.KEMIT_MEDIA[
          product.sceneMedia
        ];

      image.alt =
        product.name +
        " — utilisation";
    }

    if (title) {
      title.textContent =
        product.sceneTitle ||
        "Le produit en situation";
    }

    if (text) {
      text.textContent =
        product.sceneText || "";
    }

  }



  function remplirProduitsAssocies(currentProductId) {

    var grid =
      document.querySelector(
        "[data-related-products]"
      );


    if (!grid) {
      return;
    }


    var related =
      window.KEMIT_PRODUCTS
        .filter(
          function (product) {
            return product.id !== currentProductId;
          }
        )
        .slice(0, 3);


    grid.innerHTML =
      related
        .map(
          function (product) {

            var media =
              (
                window.KEMIT_MEDIA &&
                window.KEMIT_MEDIA[product.media]
              ) || "";


            return (
              '<article class="related-mini-card">' +

                '<div class="related-mini-visual">' +
                  '<img src="' + media + '" alt="' +
                    escapeHtml(product.name) + '" loading="lazy">' +
                '</div>' +

                '<div class="related-mini-body">' +

                  '<p>' +
                    escapeHtml(product.category) +
                  '</p>' +

                  '<h3>' +
                    escapeHtml(product.name) +
                  '</h3>' +

                  '<button ' +
                    'class="button button-secondary" ' +
                    'type="button" ' +
                    'data-product-id="' +
                      escapeHtml(product.id) +
                    '">' +
                    'Découvrir' +
                  '</button>' +

                '</div>' +

              '</article>'
            );

          }
        )
        .join("");

  }



  function getProduct(productId) {

    return window.KEMIT_PRODUCTS
      .find(
        function (product) {

          return (
            product.id ===
            String(
              productId || ""
            )
          );

        }
      ) || null;

  }



  /* =========================================================
     FILTRES BOUTIQUE
  ========================================================= */

  function initialiserFiltresBoutique() {

    document
      .addEventListener(
        "click",
        function (event) {

          var button =
            event.target.closest(
              "[data-filter]"
            );


          if (!button) {

            return;

          }


          var filters =
            button.closest(
              "[data-shop-filters]"
            );


          if (!filters) {

            return;

          }


          filters
            .querySelectorAll(
              "[data-filter]"
            )
            .forEach(
              function (item) {

                item.classList.remove(
                  "active"
                );

              }
            );


          button.classList.add(
            "active"
          );


          var filter =
            button.getAttribute(
              "data-filter"
            );


          document
            .querySelectorAll(
              '[data-product-grid="boutique"] ' +
              '[data-product-category]'
            )
            .forEach(
              function (card) {

                var category =
                  card.getAttribute(
                    "data-product-category"
                  );


                card.style.display =
                  (
                    filter === "all" ||
                    category === filter
                  )
                    ? ""
                    : "none";

              }
            );

        }
      );

  }



  /* =========================================================
     WHATSAPP
  ========================================================= */

  function initialiserCommandes() {

    document
      .addEventListener(
        "click",
        function (event) {

          var button =
            event.target.closest(
              ".js-order"
            );


          if (!button) {

            return;

          }


          event.preventDefault();


          ouvrirWhatsApp(
            button.getAttribute(
              "data-product"
            ) || ""
          );

        }
      );

  }



  function ouvrirWhatsApp(productName) {

    var number =
      String(
        window.KEMIT_WHATSAPP_PRIMARY ||
        "237678420995"
      )
      .replace(
        /\D/g,
        ""
      );


    var message =
      "Bonjour KEMIT ECOLOGY, " +
      "je souhaite obtenir des informations " +
      "pour une commande.";


    if (productName) {

      message +=
        "\n\nProduit : " +
        productName;

    }


    message +=
      "\nFormat : à préciser" +
      "\nQuantité : à préciser" +
      "\nDestination : à préciser";


    window.open(
      "https://wa.me/" +
      number +
      "?text=" +
      encodeURIComponent(
        message
      ),
      "_blank",
      "noopener"
    );

  }



  /* =========================================================
     HELPERS
  ========================================================= */

  function setText(
    selector,
    value
  ) {

    var element =
      document.querySelector(
        selector
      );


    if (element) {

      element.textContent =
        value || "";

    }

  }



  function escapeHtml(value) {

    return String(
      value == null
        ? ""
        : value
    )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

  }

})();

</script>

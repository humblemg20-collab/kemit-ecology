<script>
// Catalogue sourced from Products.html, loaded first by App.html.

(function () {
  "use strict";

  const WHATSAPP = "237678420995";
  const WHATSAPP_BASE = "https:" + String.fromCharCode(47, 47) + "wa.me/";
  let currentProduct = null;
  let selectedFormat = null;
  let activeFilter = "all";

  const pages = () => Array.from(document.querySelectorAll("[data-page]"));

  function mobileLiteActive() {
    return !!(window.matchMedia && window.matchMedia("(max-width: 767px)").matches);
  }

  function desktopFocusActive() {
    return !!(window.matchMedia && window.matchMedia("(min-width: 981px)").matches);
  }

  function streamlinedLayoutActive() {
    return mobileLiteActive() || desktopFocusActive();
  }

  // Do not request pictures or footage in editorial blocks hidden by either layout.
  function mediaHiddenByLayout(element) {
    if (!streamlinedLayoutActive()) return false;
    for (let node = element; node && node !== document.documentElement; node = node.parentElement) {
      if (window.getComputedStyle(node).display === "none") return true;
    }
    return false;
  }

  // KEMIT MEDIA — single source of truth, network-aware loading state.
  // Prewarm small, page-leading photographs so navigation can reuse browser cache.
  // Large editorial PNGs remain lazy and should be delivered as compressed WebP/AVIF.
  const ROUTE_HERO_MEDIA = {
    home: "media-home-team",
    boutique: "product-montage",
    professionnels: "pro-hero-kikimouh",
    "savoir-faire": "savoir-faire-hero-reno",
    histoire: "photo-team-history",
    livraison: "photo-delivery"
  };
  const warmedHeroImages = new Map();

  function warmRouteHero(route) {
    const key = ROUTE_HERO_MEDIA[String(route || "").split("/")[0]];
    const url = key && (window.KEMIT_MEDIA || {})[key];
    if (!url || warmedHeroImages.has(url)) return;
    if (mobileLiteActive() && !["home", "savoir-faire"].includes(String(route).split("/")[0])) return;
    const img = new Image();
    img.decoding = "async";
    img.fetchPriority = "low";
    warmedHeroImages.set(url, img);
    img.src = url;
  }

  function warmNavigationTarget(target) {
    if (!target || !target.closest) return;
    const link = target.closest("[data-route]");
    if (link) warmRouteHero(link.dataset.route);
  }

  // Warm on intent (hover, keyboard or touch) before a route is opened.
  document.addEventListener("pointerover", event => warmNavigationTarget(event.target), {passive:true});
  document.addEventListener("focusin", event => warmNavigationTarget(event.target));
  document.addEventListener("touchstart", event => warmNavigationTarget(event.target), {passive:true});

  function warmLikelyNextHeroes(activeRoute) {
    // On mobile, skip background prefetches to prioritize the active page.
    if (mobileLiteActive()) return;
    const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (connection && (connection.saveData || /^(slow-2g|2g|3g)$/.test(connection.effectiveType || ""))) return;
    const suggested = ["boutique", "professionnels", "savoir-faire", "home", "histoire"];
    const work = () => {
      if (document.visibilityState === "hidden") return;
      suggested.filter(route => route !== activeRoute.split("/")[0])
        .slice(0, 4).forEach((route, index) => {
          window.setTimeout(() => {
            if (document.visibilityState !== "hidden") warmRouteHero(route);
          }, index * 350);
        });
    };
    if ("requestIdleCallback" in window) window.requestIdleCallback(work, {timeout:3000});
    else window.setTimeout(work, 900);
  }

  function hydrateImages(root) {
    const active = document.querySelector(".app-page.is-active");
    (root || active || document).querySelectorAll("img[data-media]").forEach(img => {
      if (mediaHiddenByLayout(img)) return;
      const key = img.dataset.media;
      const source = (window.KEMIT_MEDIA || {})[key] || "";
      const host = img.closest(".photo-mat, .page-hero-media, .activity-card.with-photo, .boutique-editorial-media, .sf-image-frame, .sf-hero-media");
      const mediaCard = img.closest("[data-media-card]");

      const setMediaState = (loaded, failed) => {
        img.hidden = failed;
        if (mediaCard) {
          mediaCard.classList.toggle("has-media", loaded);
          if (mediaCard.classList.contains("kemit-gallery-card")) {
            mediaCard.classList.toggle("has-loaded", loaded);
            mediaCard.classList.toggle("is-unavailable", failed);
            const note = mediaCard.querySelector(".kemit-gallery-placeholder small");
            if (note && failed) note.textContent = "Photographie indisponible";
          }
        }
        if (host) {
          let fallback = host.querySelector(".kemit-photo-fallback");
          if (failed && !fallback) {
            fallback = document.createElement("span");
            fallback.className = "kemit-photo-fallback";
            fallback.setAttribute("role", "img");
            fallback.setAttribute("aria-label", img.alt || "Photographie indisponible");
            fallback.textContent = "Visuel temporairement indisponible";
            host.prepend(fallback);
          }
          if (fallback) fallback.hidden = !failed;
        }
      };

      if (!img.dataset.kemitMediaBound) {
        img.dataset.kemitMediaBound = "true";
        img.addEventListener("load", () => setMediaState(true, false));
        img.addEventListener("error", () => setMediaState(false, true));
      }

      if (!source) {
        img.removeAttribute("src");
        setMediaState(false, true);
        return;
      }

      img.decoding = "async";
      if (img.getAttribute("src") !== source) {
        img.src = source;
        setMediaState(false, false);
      }
      // A lazy image can temporarily report complete with no decoded bitmap.
      // Only a real error event should mark a remotely hosted image unavailable.
      if (img.complete && img.naturalWidth > 0) setMediaState(true, false);
    });
  }

  function pauseInactiveVideos() {
    document.querySelectorAll("video[data-video-media]").forEach(video => {
      const onActivePage = !!video.closest(".app-page.is-active");
      if (!onActivePage || mediaHiddenByLayout(video)) {
        if (!video.paused) video.pause();
      }
    });
  }

  function hydrateVideos(root) {
    const active = document.querySelector(".app-page.is-active");
    (root || active || document).querySelectorAll("video[data-video-media]").forEach(video => {
      if (mediaHiddenByLayout(video)) return;
      const url = (window.KEMIT_MEDIA || {})[video.dataset.videoMedia] || "";
      if (!url) {
        video.hidden = true;
        video.removeAttribute("src");
        return;
      }
      video.hidden = false;
      // Posters keep the documentary footage visually meaningful before playback.
      const posterKey = video.dataset.posterMedia;
      const poster = posterKey && (window.KEMIT_MEDIA || {})[posterKey];
      if (poster && video.getAttribute("poster") !== poster) video.poster = poster;
      if (video.getAttribute("src") !== url) {
        video.preload = "none";
        video.src = url;
      }
    });
  }

  // KEMIT MOTION V3 — full-site motion identity + SPA lifecycle
  let motionObserver = null;
  let motionInitialized = false;
  let tiltInitialized = false;
  let motionScrollRaf = 0;

  function prefersReducedMotion() {
    return streamlinedLayoutActive() || !!(window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  }

  function ensureAmbientLayer(root) {
    if (streamlinedLayoutActive()) return;
    if (!root || root.querySelector(":scope > .kemit-ambient")) return;
    root.classList.add("has-kemit-ambient");
    const layer = document.createElement("div");
    layer.className = "kemit-ambient";
    layer.setAttribute("aria-hidden", "true");
    layer.innerHTML = '<span class="kemit-ambient-orb orb-a"></span><span class="kemit-ambient-orb orb-b"></span><span class="kemit-ambient-grain"></span>';
    root.prepend(layer);
  }

  function ensureScrollProgress() {
    if (streamlinedLayoutActive()) return;
    if (document.querySelector(".kemit-scroll-progress")) return;
    const bar = document.createElement("div");
    bar.className = "kemit-scroll-progress";
    bar.setAttribute("aria-hidden", "true");
    document.body.appendChild(bar);
  }

  function decorateMotion(root) {
    const scope = root || document;
    const generalSelectors = [
      ".hero-copy > .eyebrow",
      ".hero-copy > h1",
      ".hero-copy > .hero-lead",
      ".hero-actions",
      ".hero-meta",
      ".hero-photo",
      ".page-hero-grid > *",
      ".faq-hero > *",
      ".contact-hero > *",
      ".section-heading > *",
      ".small-photo-feature",
      ".editorial-copy",
      ".faq-group",
      ".contact-card",
      ".graphic-panel",
      ".home-story > *",
      ".dark-grid > *",
      ".product-detail-grid > *",
      ".product-info-grid > *",
      ".section > .shell > *",
      ".address-grid > *",
      ".catalog-toolbar > *",
      ".format-panel",
      ".order-inline > *",
      ".product-detail-copy > *",
      ".faq-group > h2",
      ".faq-group details"
    ];

    scope.querySelectorAll(generalSelectors.join(",")).forEach((el, index) => {
      el.classList.add("reveal-item");
      if (!el.style.getPropertyValue("--reveal-delay")) {
        el.style.setProperty("--reveal-delay", Math.min((index % 5) * 60, 240) + "ms");
      }
    });

    scope.querySelectorAll(".split-editorial").forEach(section => {
      const children = Array.from(section.children);
      if (children[0]) children[0].classList.add("reveal-item", "reveal-left");
      if (children[1]) {
        children[1].classList.add("reveal-item", "reveal-right");
        children[1].style.setProperty("--reveal-delay", "90ms");
      }
    });

    const staggerGroups = [
      ".activity-grid",
      ".product-grid",
      ".use-grid",
      ".steps-grid",
      ".process-strip",
      ".story-grid",
      ".zones-grid",
      ".three-values",
      ".contact-grid",
      ".address-grid",
      ".product-info-grid",
      ".format-options",
      ".faq-group",
      ".home-media-wall",
      ".home-category-grid",
      ".home-proof-grid",
      ".home-journey-grid",
      ".home-assurance-grid",
      ".professional-use-grid"
    ];

    scope.querySelectorAll(staggerGroups.join(",")).forEach(group => {
      Array.from(group.children).forEach((child, index) => {
        child.classList.add("reveal-item");
        child.style.setProperty("--reveal-delay", Math.min(index * 82, 330) + "ms");
      });
    });

    scope.querySelectorAll(".section, .page-hero, .product-detail-hero").forEach((section, index) => {
      section.classList.add("motion-section");
      section.style.setProperty("--motion-section-index", String(index));
    });

    scope.querySelectorAll(".steps-grid, .process-strip, .three-values")
      .forEach(el => el.classList.add("motion-flow-grid"));

    scope.querySelectorAll(".graphic-panel")
      .forEach(el => el.classList.add("motion-orbit"));

    scope.querySelectorAll(
      ".hero-photo .photo-mat img, .page-hero-media img, .product-detail-media img, .small-photo-feature img, .scene-media img"
    ).forEach(el => el.classList.add("motion-scroll-media"));
  }

  function enhanceMotionClasses(root) {
    const scope = root || document;
    scope.querySelectorAll(".section, .page-hero, .product-detail-hero").forEach(section => {
      const items = Array.from(section.querySelectorAll(".reveal-item"));
      items.forEach((el,index) => {
        if (!el.classList.contains("reveal-left") && !el.classList.contains("reveal-right")) {
          if (index % 5 === 1) el.classList.add("reveal-up");
          if (index % 5 === 2) el.classList.add("reveal-pop");
          if (index % 5 === 3) el.classList.add("reveal-soft-left");
        }
        if (!el.style.getPropertyValue("--reveal-delay")) {
          el.style.setProperty("--reveal-delay", Math.min(index * 60,300) + "ms");
        }
      });
    });
  }

  function registerTiltTargets(root) {
    const scope = root || document;
    scope.querySelectorAll(
      ".hero-photo .photo-mat, .page-feature .photo-mat, .page-hero-media, .product-detail-media, .graphic-panel"
    ).forEach(el => el.classList.add("motion-tilt"));
  }

  function resetMotionState(root) {
    const scope = root || document;
    scope.querySelectorAll(".reveal-item").forEach(el => {
      if (motionObserver) motionObserver.unobserve(el);
      el.classList.remove("is-visible");
    });
  }

  function registerMotion(root, options) {
    const scope = root || document;
    const replay = !!(options && options.replay);

    // Keep all content visible without creating reveal/tilt observers on mobile.
    if (streamlinedLayoutActive()) {
      scope.querySelectorAll(".reveal-item").forEach(el => el.classList.add("is-visible"));
      return;
    }

    decorateMotion(scope);
    enhanceMotionClasses(scope);
    registerTiltTargets(scope);

    if (replay) {
      resetMotionState(scope);
      void scope.offsetHeight;
    }

    if (!motionInitialized) return;

    if (prefersReducedMotion() || !motionObserver) {
      scope.querySelectorAll(".reveal-item").forEach(el => el.classList.add("is-visible"));
      return;
    }

    scope.querySelectorAll(".reveal-item:not(.is-visible)").forEach(el => {
      motionObserver.observe(el);
    });
  }

  function initTiltMotion() {
    if (tiltInitialized) return;
    tiltInitialized = true;

    const finePointer = window.matchMedia &&
      window.matchMedia("(pointer:fine)").matches;
    if (!finePointer || prefersReducedMotion()) return;

    document.addEventListener("pointermove", event => {
      const target = event.target.closest(".motion-tilt");
      if (!target) return;
      const rect = target.getBoundingClientRect();
      const px = Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width));
      const py = Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height));
      target.style.setProperty("--tilt-y",((px-.5)*5).toFixed(2)+"deg");
      target.style.setProperty("--tilt-x",((.5-py)*3.8).toFixed(2)+"deg");
      target.style.setProperty("--pointer-x",(px*100).toFixed(1)+"%");
      target.style.setProperty("--pointer-y",(py*100).toFixed(1)+"%");
    }, {passive:true});

    document.addEventListener("pointerout", event => {
      const target = event.target.closest(".motion-tilt");
      if (!target || (event.relatedTarget && target.contains(event.relatedTarget))) return;
      target.style.setProperty("--tilt-x","0deg");
      target.style.setProperty("--tilt-y","0deg");
      target.style.setProperty("--pointer-x","50%");
      target.style.setProperty("--pointer-y","50%");
    });
  }

  function updateScrollMotion() {
    motionScrollRaf = 0;
    if (streamlinedLayoutActive()) return;
    const activePage = document.querySelector(".app-page.is-active");
    if (!activePage) return;

    const doc = document.documentElement;
    const maxScroll = Math.max(1, doc.scrollHeight - window.innerHeight);
    const pageProgress = Math.max(0, Math.min(1, window.scrollY / maxScroll));
    activePage.style.setProperty("--motion-page-progress", pageProgress.toFixed(4));
    activePage.style.setProperty("--motion-grid-y", Math.min(window.scrollY * .065, 84).toFixed(1) + "px");
    document.documentElement.style.setProperty("--page-progress", (pageProgress * 100).toFixed(2) + "%");

    const progressBar = document.querySelector(".kemit-scroll-progress");
    if (progressBar) progressBar.style.transform = "scaleX(" + pageProgress.toFixed(4) + ")";

    const vh = window.innerHeight || 1;

    activePage.querySelectorAll(".motion-section").forEach(section => {
      const rect = section.getBoundingClientRect();
      const progress = Math.max(0, Math.min(1, (vh - rect.top) / (vh + rect.height)));
      section.style.setProperty("--motion-section-progress", progress.toFixed(4));
    });

    if (!prefersReducedMotion()) {
      activePage.querySelectorAll(".motion-scroll-media").forEach((media, index) => {
        const rect = media.getBoundingClientRect();
        const center = rect.top + rect.height / 2;
        const distance = (center - vh / 2) / vh;
        const amplitude = window.innerWidth < 650 ? 7 : 15;
        const drift = Math.max(-amplitude, Math.min(amplitude, distance * -amplitude));
        media.style.setProperty("--motion-drift-y", drift.toFixed(2) + "px");
        media.style.setProperty("--motion-drift-r", ((index % 2 ? -1 : 1) * distance * .28).toFixed(2) + "deg");
      });

      activePage.querySelectorAll(".media-wall-card").forEach((card,index) => {
        const rect = card.getBoundingClientRect();
        const center = rect.top + rect.height / 2;
        const distance = (center - vh / 2) / vh;
        const amplitude = window.innerWidth < 650 ? 6 : 20;
        const direction = index % 2 ? -1 : 1;
        const drift = Math.max(-amplitude,Math.min(amplitude,distance * amplitude * direction));
        card.style.setProperty("--media-drift-y",drift.toFixed(2) + "px");
      });
    }
  }

  function requestScrollMotion() {
    if (motionScrollRaf) return;
    motionScrollRaf = window.requestAnimationFrame(updateScrollMotion);
  }

  function refreshMotion(replay) {
    window.requestAnimationFrame(() => {
      const activePage = document.querySelector(".app-page.is-active");
      if (!activePage) return;
      if (streamlinedLayoutActive()) {
        activePage.querySelectorAll(".reveal-item").forEach(el => el.classList.add("is-visible"));
        return;
      }
      ensureAmbientLayer(activePage);
      if (replay && motionObserver) motionObserver.disconnect();
      if (replay) resetInactivePageMotion(activePage);
      registerMotion(activePage, {replay:!!replay});
      requestScrollMotion();
    });
  }

  function initMotion() {
    if (motionInitialized) return;
    motionInitialized = true;

    if (!prefersReducedMotion() && "IntersectionObserver" in window) {
      motionObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("is-visible");
          motionObserver.unobserve(entry.target);
        });
      }, {
        threshold:0.12,
        rootMargin:"0px 0px -8% 0px"
      });
    }

    document.body.classList.add("motion-ready");
    ensureScrollProgress();

    const header = document.querySelector(".site-header");
    const syncHeader = () => {
      if (header) header.classList.toggle("is-scrolled", window.scrollY > 18);
      requestScrollMotion();
    };

    syncHeader();
    window.addEventListener("scroll", syncHeader, {passive:true});
    window.addEventListener("resize", requestScrollMotion, {passive:true});

    initTiltMotion();
    initHumblePatternBackground();
    refreshMotion(true);
  }

  // KEMIT MOTION V4 — navigation-safe replay
  function resetInactivePageMotion(activePage) {
    pages().forEach(page => {
      if (page === activePage) return;
      page.querySelectorAll(".reveal-item").forEach(el => {
        if (motionObserver) motionObserver.unobserve(el);
        el.classList.remove("is-visible");
      });
      page.style.setProperty("--motion-page-progress","0");
    });
  }

  // HUMBLECLIENT PATTERN PORT — global background response
  function initHumblePatternBackground() {
    if (prefersReducedMotion()) return;
    const root = document.documentElement;
    let raf = 0;
    let x = 0;
    let y = 0;

    const sync = () => {
      raf = 0;
      root.style.setProperty("--hc-bg-x", x.toFixed(1) + "px");
      root.style.setProperty("--hc-bg-y", y.toFixed(1) + "px");
    };

    document.addEventListener("pointermove", event => {
      const nx = (event.clientX / Math.max(1,window.innerWidth)) - .5;
      const ny = (event.clientY / Math.max(1,window.innerHeight)) - .5;
      x = nx * 24;
      y = ny * 18;
      if (!raf) raf = window.requestAnimationFrame(sync);
    }, {passive:true});
  }

  // Page-specific metadata, also maintained during hash SPA navigation.
  const ROUTE_META = {
    home:["KEMIT ECOLOGY | Biomasse et solutions durables","KEMIT ECOLOGY valorise la biomasse en charbon écologique, biochar et solutions utiles au Cameroun."],
    boutique:["Boutique | KEMIT ECOLOGY","Découvrez le charbon écologique, le biochar et les solutions KEMIT ECOLOGY. Demandez une commande via WhatsApp."],
    professionnels:["Professionnels | KEMIT ECOLOGY","Approvisionnement, volumes et demandes de devis professionnels pour les solutions KEMIT ECOLOGY."],
    "savoir-faire":["Savoir-faire | KEMIT ECOLOGY","Découvrez la collecte, la transformation et le conditionnement de la biomasse chez KEMIT ECOLOGY."],
    histoire:["Notre histoire | KEMIT ECOLOGY","Découvrez le parcours, l’équipe et l’engagement terrain de KEMIT ECOLOGY au Cameroun."],
    livraison:["Livraison | KEMIT ECOLOGY","Informations sur les destinations et les modalités de livraison des produits KEMIT ECOLOGY."],
    faq:["Questions fréquentes | KEMIT ECOLOGY","Réponses aux questions courantes sur les produits, la commande et les services KEMIT ECOLOGY."],
    contact:["Contact | KEMIT ECOLOGY","Contactez KEMIT ECOLOGY à Douala pour vos commandes, vos projets de formation et vos besoins professionnels."]
  };

  function updateRouteMeta(route, product) {
    const meta = product
      ? [product.name + " | KEMIT ECOLOGY", product.short || product.description]
      : (ROUTE_META[route] || ROUTE_META.home);
    document.title = meta[0];
    const description = document.querySelector('meta[name="description"]');
    if (description) description.setAttribute("content", meta[1]);
  }

  function routeFromHash() {
    const raw = location.hash.replace(/^#/, "").trim();
    return raw || document.body.dataset.initialRoute || "home";
  }

  // Inform the trusted Hostinger bridge of SPA route changes.
  // No effect on direct /exec visits.
  function notifyHostRoute(route) {
    if (window.top === window.self) return;
    const bridgeToken = document.body && document.body.dataset.kemitBridge;
    if (!/^[a-f0-9]{32}$/.test(bridgeToken || "")) return;
    try {
      window.top.postMessage(
        {type: "KEMIT_ROUTE_CHANGED", route: String(route || "home"), token: bridgeToken},
        "https://kemitecology.afrigreen24.com"
      );
    } catch (error) {
      // Embedding is optional: never break ordinary site navigation.
    }
  }

  function showPage(route, updateHash) {
    let page = route.split("/")[0] || "home";
    let productId = route.split("/")[1] || "";

    if (!["home","boutique","produit","professionnels","savoir-faire","histoire","livraison","faq","contact"].includes(page)) {
      page = "home";
      route = "home";
    }

    pages().forEach(el => el.classList.toggle("is-active", el.dataset.page === page));

    document.querySelectorAll(".main-nav [data-route]").forEach(a => {
      a.classList.toggle("is-current", a.dataset.route === page);
    });

    if (page === "produit") {
      if (!productId && currentProduct) productId = currentProduct.id;
      if (!productId) {
        showPage("boutique", true);
        return;
      }
      document.querySelector("[data-nav]")?.classList.remove("is-open");
      document.querySelector("[data-nav-toggle]")?.setAttribute("aria-expanded", "false");
      // The product handler owns hash, metadata, scroll and motion replay.
      openProduct(productId, updateHash);
      return;
    }

    if (updateHash && location.hash !== "#" + route) {
      history.pushState(null, "", "#" + route);
    }

    document.querySelector("[data-nav]")?.classList.remove("is-open");
    document.querySelector("[data-nav-toggle]")?.setAttribute("aria-expanded", "false");
    updateRouteMeta(page, page === "produit" ? currentProduct : null);
    notifyHostRoute(page);
    // Do not start downloads for pages hidden by the SPA router.
    pauseInactiveVideos();
    hydrateImages();
    hydrateVideos();
    window.scrollTo({top:0,left:0,behavior:"auto"});
    refreshMotion(true);
  }

  function productPrice(product) {
    return product.formats?.[0]?.price || "Sur demande";
  }

  const PRODUCT_OUTCOMES = {
    "charbon-ecologique": "Passez d'un besoin de combustible à une chaleur issue de biomasses transformées.",
    "biochar": "Donnez à votre projet agricole une ressource carbonée pensée pour la gestion des sols.",
    "charbon-actif-industriel": "Cadrez votre besoin de traitement avec une référence à valider selon votre application.",
    "savon-charbon": "Simplifiez le nettoyage quotidien avec un soin cosmétique au charbon, simple à intégrer.",
    "masque-charbon": "Complétez votre routine avec un soin cosmétique au charbon, facile à préparer et à utiliser."
  };

  function productOutcome(product) {
    return PRODUCT_OUTCOMES[product.id] || "Trouvez le format adapté à votre usage et à votre projet.";
  }

  function productCard(product) {
    const photoUrl = window.KEMIT_MEDIA[product.media];
    const mediaMarkup = photoUrl
      ? '<img src="' + escapeHtml(photoUrl) + '" alt="' + escapeHtml(product.name) + '" loading="lazy">'
      : '<div class="product-media-placeholder" role="img" aria-label="Visuel à confirmer pour ' + escapeHtml(product.name) + '"><span>Visuel à confirmer</span></div>';
    return `
      <article class="product-card" data-category="${escapeHtml(product.category)}">
        <div class="product-card-media">
          ${mediaMarkup}
        </div>
        <div class="product-card-body">
          <span class="product-card-category">${escapeHtml(product.category)}</span>
          <h3>${escapeHtml(product.name)}</h3>
          <p class="product-card-outcome">${escapeHtml(productOutcome(product))}</p>
          <p class="product-card-description">${escapeHtml(product.short)}</p>
          <div class="product-card-footer">
            <span class="price-from">Dès ${escapeHtml(productPrice(product))}</span>
            <button class="card-link" type="button" data-product-id="${product.id}">Découvrir la solution →</button>
          </div>
        </div>
      </article>
    `;
  }

  function renderCatalog() {
    const grid = document.querySelector("[data-product-grid]");
    if (!grid) return;
    const items = activeFilter === "all"
      ? window.KEMIT_PRODUCTS
      : window.KEMIT_PRODUCTS.filter(p => p.category === activeFilter);
    grid.innerHTML = items.map(productCard).join("");
    registerMotion(grid);
  }

  function renderRelated(product) {
    const grid = document.querySelector("[data-related-products]");
    if (!grid) return;
    const others = window.KEMIT_PRODUCTS.filter(p => p.id !== product.id).slice(0,3);
    grid.innerHTML = others.map(productCard).join("");
    registerMotion(grid);
  }

  function openProduct(id, updateHash=true) {
    const product = window.KEMIT_PRODUCTS.find(p => p.id === id);
    if (!product) {
      showPage("boutique", updateHash);
      return;
    }
    currentProduct = product;
    selectedFormat = product.formats?.[0] || null;

    setText("[data-product-category]", product.category);
    setText("[data-product-name]", product.name);
    setText("[data-product-description]", product.description);
    setText("[data-product-outcome]", productOutcome(product));
    setText("[data-product-usage]", product.usage);
    setText("[data-product-composition]", product.composition);
    setText("[data-product-audience]", product.audience);
    setText("[data-product-stock]", product.stock);
    setText("[data-product-conservation]", product.conservation);
    setText("[data-product-precautions]", product.precautions);
    setText("[data-product-professional]", product.professional);

    const img = document.querySelector("[data-product-image]");
    if (img) {
      const photo = window.KEMIT_MEDIA[product.media];
      img.hidden = !photo;
      if (photo) img.src = photo;
      else img.removeAttribute("src");
      img.alt = product.name;
      const fallback = document.querySelector("[data-product-image-fallback]");
      if (fallback) fallback.hidden = !!photo;
    }

    const formats = document.querySelector("[data-product-formats]");
    if (formats) {
      formats.innerHTML = product.formats.map((f,i) => `
        <button class="format-chip ${i===0 ? "is-selected":""}" type="button" data-format-index="${i}">
          ${escapeHtml(f.label)} · ${escapeHtml(f.price)}
        </button>
      `).join("");
    }

    const scene = document.querySelector("[data-product-scene]");
    if (scene && product.sceneMedia && window.KEMIT_MEDIA[product.sceneMedia]) {
      scene.hidden = false;
      const simg = scene.querySelector("[data-product-scene-image]");
      if (simg) {
        simg.src = window.KEMIT_MEDIA[product.sceneMedia];
        simg.alt = product.name + " — contexte réel";
      }
      setText("[data-product-scene-title]", product.sceneTitle);
      setText("[data-product-scene-text]", product.sceneText);
    } else if (scene) {
      scene.hidden = true;
    }

    renderRelated(product);

    pages().forEach(el => el.classList.toggle("is-active", el.dataset.page === "produit"));
    pauseInactiveVideos();
    if (updateHash) history.pushState(null, "", "#produit/" + product.id);
    updateRouteMeta("produit", product);
    notifyHostRoute("produit/" + product.id);
    window.scrollTo({top:0,left:0,behavior:"auto"});
    refreshMotion(true);
  }

  function setText(selector, value) {
    const el = document.querySelector(selector);
    if (el) el.textContent = value || "";
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function trackKemitIntent(event, productId) {
    if (Array.isArray(window.dataLayer)) {
      window.dataLayer.push({event: event, product_id: productId || undefined});
    }
  }

  function populateProfessionalProducts() {
    const select = document.querySelector("[data-b2b-product]");
    if (!select) return;
    // Reuse the catalogue rather than maintaining a parallel product list.
    const placeholder = select.querySelector('option[value=""]');
    select.replaceChildren();
    if (placeholder) select.append(placeholder);
    window.KEMIT_PRODUCTS.forEach(product => {
      const option = document.createElement("option");
      option.value = product.id;
      option.textContent = product.name;
      select.append(option);
    });
  }

  function scrollToProfessionalForm() {
    document.getElementById("demande-devis")?.scrollIntoView({behavior: "smooth", block: "start"});
  }

  function kemitToggleNav() {
    const nav = document.querySelector("[data-nav]");
    if (!nav) return;
    const isOpen = nav.classList.toggle("is-open");
    document.querySelector("[data-nav-toggle]")?.setAttribute("aria-expanded", String(isOpen));
  }

  function kemitFilter(filter) {
    activeFilter = filter || "all";
    document.querySelectorAll("[data-filter]").forEach(x => x.classList.toggle("is-selected", activeFilter !== "all" && x.dataset.filter === activeFilter));
    renderCatalog();
  }

  function kemitGoTo(route) {
    if (route === "boutique") {
      activeFilter = "all";
      document.querySelectorAll("[data-filter]").forEach(x => x.classList.remove("is-selected"));
      renderCatalog();
    }
    showPage(route, true);
  }

  function kemitProductB2B() {
    if (!currentProduct) return;
    showPage("professionnels", true);
    const select = document.querySelector("[data-b2b-product]");
    if (select) select.value = currentProduct.id;
    scrollToProfessionalForm();
  }

  window.kemitToggleNav = kemitToggleNav;
  window.kemitFilter = kemitFilter;
  window.kemitGoTo = kemitGoTo;
  window.kemitProductB2B = kemitProductB2B;
  window.kemitScrollToProfessionalForm = scrollToProfessionalForm;

  function submitProfessionalRequest(form) {
    for (const name of ["company", "destination"]) form.elements.namedItem(name)?.setCustomValidity("");
    if (!form.reportValidity()) return;
    const value = name => String(form.elements.namedItem(name)?.value || "").trim();
    const product = window.KEMIT_PRODUCTS.find(p => p.id === value("product"));
    const quantity = Number(value("quantity"));
    if (!product || !Number.isFinite(quantity) || quantity <= 0 || quantity > 100000000) return;
    const company = value("company");
    const destination = value("destination");
    if (!company || !destination) {
      const missing = !company ? form.elements.namedItem("company") : form.elements.namedItem("destination");
      if (missing) {
        missing.setCustomValidity("Ce champ doit contenir une information valide.");
        missing.reportValidity();
      }
      return;
    }
    const unit = value("unit");
    const frequency = value("frequency");
    const notes = value("notes");
    const message = [
      "Bonjour KEMIT ECOLOGY,",
      "",
      "Je souhaite recevoir une proposition commerciale pour un approvisionnement professionnel.",
      "Entreprise : " + company,
      "Produit : " + product.name,
      "Volume estimé : " + quantity + " " + unit,
      "Fréquence : " + frequency,
      "Destination : " + destination,
      notes ? "Précisions : " + notes : "",
      "",
      "Merci de me confirmer la faisabilité, la disponibilité, le tarif et les modalités de livraison."
    ].filter((line, index) => line || index < 2).join(String.fromCharCode(10));
    trackKemitIntent("kemit_b2b_quote_click", product.id);
    window.open(WHATSAPP_BASE + WHATSAPP + "?text=" + encodeURIComponent(message), "_blank", "noopener");
  }
  function whatsappOrder() {
    if (!currentProduct) return;
    const qtyField = document.querySelector("[data-order-qty]");
    const destField = document.querySelector("[data-order-destination]");
    destField?.setCustomValidity("");
    if (!qtyField?.reportValidity() || !destField?.reportValidity()) return;
    const qty = Number(qtyField.value);
    if (!Number.isSafeInteger(qty) || qty < 1) return;
    const dest = destField.value.trim();
    if (!dest) {
      destField.setCustomValidity("Précisez votre ville et votre pays.");
      destField.reportValidity();
      return;
    }
    destField.setCustomValidity("");
    const format = selectedFormat
      ? `${selectedFormat.label} — ${selectedFormat.price}`
      : "À confirmer";

    const message =
`Bonjour KEMIT ECOLOGY,

Je souhaite commander :
Produit : ${currentProduct.name}
Format : ${format}
Quantité : ${qty}
Destination : ${dest}

Merci de me confirmer la disponibilité, le total, le paiement et la livraison.`;

    trackKemitIntent("kemit_retail_order_click", currentProduct.id);
    window.open(WHATSAPP_BASE + WHATSAPP + "?text=" + encodeURIComponent(message), "_blank", "noopener");
  }

  window.kemitWhatsappOrder = whatsappOrder;

  document.addEventListener("submit", e => {
    const form = e.target.closest("[data-b2b-form]");
    if (!form) return;
    e.preventDefault();
    submitProfessionalRequest(form);
  });

  document.addEventListener("click", e => {
    const stepJump = e.target.closest("[data-sf-scroll]");
    if (stepJump) {
      e.preventDefault();
      const destination = document.getElementById(stepJump.dataset.sfScroll);
      if (destination && destination.closest(".app-page.is-active")) {
        destination.scrollIntoView({behavior:prefersReducedMotion() ? "auto" : "smooth",block:"start"});
      }
      return;
    }
    if (e.target.closest("[data-inline-action]")) return;

    const routeEl = e.target.closest("[data-route]");
    if (routeEl) {
      const route = routeEl.dataset.route;
      if (route && route !== "produit") {
        e.preventDefault();
        if (route === "boutique") {
          activeFilter = routeEl.dataset.categoryTarget || "all";
          document.querySelectorAll("[data-filter]").forEach(x => x.classList.toggle("is-selected", x.dataset.filter === activeFilter));
          renderCatalog();
        }
        showPage(route, true);
        return;
      }
    }

    const productEl = e.target.closest("[data-product-id]");
    if (productEl) {
      e.preventDefault();
      openProduct(productEl.dataset.productId, true);
      return;
    }

    const filterEl = e.target.closest("[data-filter]");
    if (filterEl) {
      activeFilter = filterEl.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach(x => x.classList.toggle("is-selected", x === filterEl));
      renderCatalog();
      return;
    }

    if (e.target.closest("[data-filter-reset]")) {
      activeFilter = "all";
      document.querySelectorAll("[data-filter]").forEach(x => x.classList.remove("is-selected"));
      renderCatalog();
      return;
    }

    const formatEl = e.target.closest("[data-format-index]");
    if (formatEl && currentProduct) {
      const index = Number(formatEl.dataset.formatIndex);
      selectedFormat = currentProduct.formats[index] || currentProduct.formats[0];
      document.querySelectorAll("[data-format-index]").forEach(x => x.classList.toggle("is-selected", x === formatEl));
      return;
    }

    if (e.target.closest("[data-product-b2b]")) {
      if (currentProduct) {
        showPage("professionnels", true);
        const select = document.querySelector("[data-b2b-product]");
        if (select) select.value = currentProduct.id;
        scrollToProfessionalForm();
      }
      return;
    }

    if (e.target.closest("[data-b2b-scroll]")) {
      scrollToProfessionalForm();
      return;
    }

    if (e.target.closest("[data-whatsapp-order]")) {
      whatsappOrder();
      return;
    }

    if (e.target.closest("[data-nav-toggle]")) {
      kemitToggleNav();
    }
  });

  window.addEventListener("hashchange", () => showPage(routeFromHash(), false));

  // Newly visible images are hydrated if the viewport switches to desktop.
  if (window.matchMedia) {
    const layoutQueries = [
      window.matchMedia("(max-width: 767px)"),
      window.matchMedia("(min-width: 981px)")
    ];
    const onViewportChange = () => {
      pauseInactiveVideos();
      hydrateImages();
      hydrateVideos();
      refreshMotion(false);
    };
    layoutQueries.forEach(media => {
      if (media.addEventListener) media.addEventListener("change", onViewportChange);
      else if (media.addListener) media.addListener(onViewportChange);
    });
  }

  let siteInitialized = false;
  function bootKemitSite() {
    if (siteInitialized) return;
    siteInitialized = true;
    renderCatalog();
    populateProfessionalProducts();
    initMotion();

    document.querySelectorAll("[data-year]").forEach(el => el.textContent = new Date().getFullYear());

    document.querySelectorAll("[data-whatsapp-generic]").forEach(a => {
      a.href = WHATSAPP_BASE + WHATSAPP + "?text=" +
        encodeURIComponent("Bonjour KEMIT ECOLOGY, je souhaite vous contacter au sujet de vos produits ou services.");
      a.target = "_blank";
      a.rel = "noopener";
    });

    const route = routeFromHash();
    showPage(route, false);
    warmLikelyNextHeroes(route);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bootKemitSite, {once:true});
  } else {
    bootKemitSite();
  }

  // Fallback only for elements currently in view; never pre-reveal offscreen sections.
  function revealViewportItems() {
    const active = document.querySelector(".app-page.is-active");
    if (!active || prefersReducedMotion()) return;
    const h = window.innerHeight || 1;
    active.querySelectorAll(".reveal-item:not(.is-visible)").forEach(el => {
      const bounds = el.getBoundingClientRect();
      if (bounds.height && bounds.bottom > 0 && bounds.top < h * .94) {
        el.classList.add("is-visible");
        if (motionObserver) motionObserver.unobserve(el);
      }
    });
  }

  window.addEventListener("load", () => {
    hydrateImages();
    hydrateVideos();
    window.requestAnimationFrame(() => {
      hydrateImages();
      revealViewportItems();
    });
  });


})();
</script>

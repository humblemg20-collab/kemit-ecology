<style>
:root{
  --green:#0d3b2e;
  --green2:#1e644e;
  --green3:#2d7a60;
  --cream:#f5f0e5;
  --paper:#fbfaf6;
  --ink:#152019;
  --muted:#667169;
  --line:#dfe5df;
  --white:#fff;
  --shadow:0 22px 60px rgba(10,39,30,.10);
  --radius:28px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
img{display:block;max-width:100%}
.shell{width:min(1180px,calc(100% - 40px));margin:0 auto}
.app-page{display:none}
.app-page.is-active{display:block}
.site-header{
  position:sticky;top:0;z-index:50;background:rgba(251,250,246,.92);
  backdrop-filter:blur(18px);border-bottom:1px solid rgba(13,59,46,.08)
}
.header-inner{height:82px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.brand-logo{display:block;width:auto;height:46px;max-width:170px;object-fit:contain}
.site-footer .brand-logo{height:52px;max-width:190px}
@media(max-width:520px){.brand-logo{height:40px;max-width:145px}}
.brand-mark{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  background:var(--green);color:#fff;font:600 17px Georgia,serif
}
.brand-copy{display:flex;flex-direction:column;line-height:.92}
.brand-copy strong{font:700 17px/1 Georgia,serif;letter-spacing:.05em}
.brand-copy small{font-size:8px;letter-spacing:.23em;margin-top:5px;color:var(--green2)}
.main-nav{display:flex;gap:21px;align-items:center}
.main-nav a{font-size:12px;color:#4e5d54}
.main-nav a:hover,.main-nav a.is-current{color:var(--green);font-weight:700}
.header-cta,.btn{
  border:0;border-radius:999px;padding:13px 20px;display:inline-flex;align-items:center;
  justify-content:center;cursor:pointer;font-weight:750;font-size:12px;transition:.2s ease
}
.header-cta,.btn-primary{background:var(--green);color:#fff}
.header-cta:hover,.btn-primary:hover{transform:translateY(-1px);background:#0a3025}
.btn-ghost,.btn-outline{border:1px solid var(--green);background:transparent;color:var(--green)}
.btn-light{background:#fff;color:var(--green)}
.btn-full{width:100%;margin-top:16px}
.nav-toggle{display:none;background:none;border:0;padding:8px}
.nav-toggle span{display:block;width:24px;height:2px;background:var(--green);margin:5px}
.hero{padding:82px 0 76px;background:linear-gradient(180deg,#f9f7f0 0%,#fbfaf6 100%)}
.hero-grid,.page-hero-grid,.product-detail-grid,.split-editorial,.dark-grid{
  display:grid;grid-template-columns:1.03fr .97fr;gap:70px;align-items:center
}
.eyebrow,.mini-label{
  margin:0 0 17px;color:var(--green2);font-size:10px;font-weight:850;
  letter-spacing:.13em;text-transform:uppercase
}
.eyebrow.light{color:#a8cabb}
h1,h2,h3,p{overflow-wrap:break-word}
h1{
  margin:0;font:500 clamp(56px,7vw,98px)/.90 Georgia,"Times New Roman",serif;
  letter-spacing:-.065em;max-width:850px
}
h2{
  margin:0;font:500 clamp(38px,5vw,68px)/.96 Georgia,"Times New Roman",serif;
  letter-spacing:-.05em
}
h3{font:500 27px/1.05 Georgia,serif;letter-spacing:-.025em}
.hero-lead,.page-hero p,.product-lead,.editorial-copy>p{
  color:var(--muted);font-size:15px;line-height:1.75;max-width:650px
}
.hero-lead{font-size:17px;margin:27px 0}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.hero-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:32px;color:#69776f;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.small-photo-feature{margin:0;position:relative}
.photo-mat{
  min-height:440px;border-radius:32px;background:var(--green);display:grid;place-items:center;
  padding:34px;overflow:hidden;box-shadow:var(--shadow)
}
.photo-mat img{
  width:min(100%,420px);aspect-ratio:1/1;object-fit:cover;border-radius:23px;
  box-shadow:0 20px 50px rgba(0,0,0,.24)
}
.small-photo-feature figcaption{
  width:min(82%,390px);margin:-38px auto 0;position:relative;background:#fff;border-radius:19px;
  padding:18px 20px;box-shadow:var(--shadow)
}
.small-photo-feature figcaption span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--green2);margin-bottom:5px}
.small-photo-feature figcaption strong{font:500 16px/1.25 Georgia,serif}
.section{padding:92px 0}
.section-light{background:#fff}
.section-cream{background:var(--cream)}
.section-heading{display:flex;justify-content:space-between;align-items:end;gap:50px;margin-bottom:42px}
.section-heading>div{max-width:720px}
.section-heading>p{max-width:390px;color:var(--muted);line-height:1.7}
.activity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.activity-card{background:var(--paper);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.activity-card img{width:100%;aspect-ratio:1.32/1;object-fit:cover}
.activity-card>div{padding:24px}
.activity-card span,.process-strip span,.steps-grid span,.story-grid span{color:var(--green2);font:500 16px Georgia,serif}
.activity-card h3{margin:26px 0 9px}
.activity-card p,.process-strip p,.steps-grid p,.story-grid p,.contact-card p,.zones-grid p{
  color:var(--muted);font-size:13px;line-height:1.65
}
.split-editorial.reverse>.editorial-copy{order:1}
.split-editorial.reverse>.small-photo-feature{order:2}
.editorial-copy{padding:20px 0}
.editorial-copy h2{margin-bottom:24px}
.text-link{display:inline-block;margin-top:18px;color:var(--green);font-size:13px;font-weight:800}
.dark-band{background:var(--green);color:#fff}
.dark-band h2{color:#fff}
.dark-band p{color:#c5d8cf;line-height:1.7}
.dark-grid>div:last-child{max-width:460px;justify-self:end}
.dark-grid .btn{margin-top:12px}
.home-story{display:grid;grid-template-columns:1fr 1fr auto;gap:40px;align-items:end}
.home-story>p{color:var(--muted);line-height:1.7}
.page-hero{padding:72px 0;background:#f8f6ef}
.page-hero.compact{padding:76px 0 62px}
.page-hero h1{font-size:clamp(52px,6.2vw,88px)}
.page-feature .photo-mat{min-height:390px}
.page-hero-media{
  min-height:430px;border-radius:32px;overflow:hidden;background:#eef1ed;box-shadow:var(--shadow)
}
.page-hero-media img{width:100%;height:430px;object-fit:cover}
.product-montage img{object-fit:cover}
.use-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.use-card{
  text-align:left;border:1px solid var(--line);border-radius:20px;background:var(--paper);
  padding:23px;cursor:pointer;color:var(--ink)
}
.use-card span{display:block;color:var(--green2);font:500 15px Georgia,serif;margin-bottom:38px}
.use-card strong{display:block;font:500 22px Georgia,serif}
.use-card small{display:block;color:var(--muted);margin-top:7px}
.use-card:hover,.use-card.is-selected{background:var(--green);color:#fff}
.use-card:hover small,.use-card.is-selected small,.use-card:hover span,.use-card.is-selected span{color:#bfd8cd}
.catalog-toolbar{display:flex;justify-content:space-between;align-items:end;margin-bottom:34px}
.catalog-toolbar h2{font-size:48px}
.filter-reset{border:1px solid var(--line);border-radius:999px;background:#fff;padding:11px 17px;color:var(--green);cursor:pointer}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.product-card{border:1px solid var(--line);border-radius:25px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.product-card-media{background:#f3f2ec;padding:20px;aspect-ratio:1.08/1;display:grid;place-items:center}
.product-card-media img{width:100%;height:100%;object-fit:contain;max-height:310px}
.product-card-body{padding:22px;display:flex;flex-direction:column;flex:1}
.product-card-category{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--green2)}
.product-card h3{margin:12px 0 9px}
.product-card p{color:var(--muted);font-size:12px;line-height:1.6}
.product-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:18px}
.price-from{font:600 16px Georgia,serif}
.card-link{font-size:11px;font-weight:850;color:var(--green);cursor:pointer;border:0;background:none}
.steps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.steps-grid article,.story-grid article,.zones-grid article{
  border:1px solid var(--line);border-radius:21px;background:#fff;padding:25px
}
.steps-grid h3{margin:36px 0 6px}
.product-detail-hero{padding:66px 0}
.product-detail-media{
  min-height:590px;border-radius:31px;background:#f0efe9;padding:35px;display:grid;place-items:center
}
.product-detail-media img{width:100%;height:520px;object-fit:contain}
.product-detail-copy h1{font-size:clamp(48px,5.2vw,74px);margin-top:9px}
.back-link{border:0;background:none;padding:0;margin-bottom:25px;color:var(--green2);cursor:pointer}
.format-panel{margin-top:25px;border-top:1px solid var(--line);padding-top:20px}
.format-options{display:flex;flex-wrap:wrap;gap:8px}
.format-chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;cursor:pointer;
  font-size:11px
}
.format-chip.is-selected{background:var(--green);color:#fff;border-color:var(--green)}
.order-inline{display:grid;grid-template-columns:120px 1fr;gap:10px;margin-top:18px}
.order-inline label{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.order-inline input{width:100%;margin-top:7px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.order-note{font-size:10px;color:var(--muted);line-height:1.5}
.product-info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.product-info-grid article{border:1px solid var(--line);border-radius:18px;padding:20px;background:var(--paper)}
.product-info-grid span{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--green2);font-weight:800}
.product-info-grid p{color:var(--muted);font-size:12px;line-height:1.6}
.scene-media{margin:0;border-radius:28px;overflow:hidden;background:#eee}
.scene-media img{width:100%;min-height:430px;object-fit:cover}
.process-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.process-strip article{border-top:1px solid var(--line);padding:24px 8px}
.process-strip h3{margin:36px 0 8px}
.three-values{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.three-values span{font:500 39px Georgia,serif}
.story-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.story-grid h2{font-size:38px;margin:40px 0 14px}
.graphic-panel{
  min-height:450px;border-radius:30px;background:var(--green);color:#fff;padding:36px;
  display:flex;flex-direction:column;justify-content:space-between
}
.graphic-panel span{font-size:10px;letter-spacing:.15em}
.graphic-panel strong{font:500 52px/.95 Georgia,serif}
.zones-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.zones-grid h2{font-size:36px;margin-bottom:18px}
.faq-hero{max-width:880px}
.faq-hero p:last-child{font-size:16px;color:var(--muted);max-width:650px;line-height:1.7}
.faq-layout{display:grid;grid-template-columns:repeat(3,1fr);gap:35px}
.faq-group details{border-top:1px solid var(--line);padding:17px 0}
.faq-group summary{cursor:pointer;font-weight:750;font-size:13px}
.faq-group details p{color:var(--muted);font-size:12px;line-height:1.65}
.contact-hero .shell{max-width:930px;margin-left:auto;margin-right:auto;text-align:center}
.contact-hero p{margin-left:auto;margin-right:auto}
.contact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.contact-card{border:1px solid var(--line);border-radius:25px;background:#fff;padding:29px;min-height:260px}
.contact-card>span{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--green2);font-weight:850}
.contact-card h2{font-size:38px;margin-top:35px}
.address-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:50px;align-items:start}
.address-grid h2{font-size:46px}
.address-grid strong{font:500 20px Georgia,serif}
.site-footer{background:#092c22;color:#fff;padding:62px 0 25px}
.site-footer .brand-mark{background:#fff;color:var(--green)}
.site-footer .brand-copy small{color:#9fc8b7}
.footer-grid{display:grid;grid-template-columns:1.6fr .7fr 1fr 1fr;gap:40px}
.footer-grid>div:not(:first-child){display:flex;flex-direction:column;gap:8px}
.footer-grid p,.footer-grid a{color:#a9c2b7;font-size:11px;line-height:1.6;margin:0}
.footer-title{color:#fff!important;text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.footer-manifesto{max-width:330px;margin-top:22px!important}
.footer-bottom{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.12);margin-top:45px;padding-top:19px;color:#76988a;font-size:9px;text-transform:uppercase;letter-spacing:.08em}
@media(max-width:980px){
  .main-nav{display:none;position:absolute;left:20px;right:20px;top:72px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;flex-direction:column;align-items:flex-start;box-shadow:var(--shadow)}
  .main-nav.is-open{display:flex}
  .nav-toggle{display:block}
  .header-cta{display:none}
  .hero-grid,.page-hero-grid,.product-detail-grid,.split-editorial,.dark-grid{grid-template-columns:1fr;gap:42px}
  .dark-grid>div:last-child{justify-self:start}
  .activity-grid,.product-grid,.faq-layout{grid-template-columns:repeat(2,1fr)}
  .use-grid,.steps-grid,.process-strip{grid-template-columns:repeat(2,1fr)}
  .home-story,.address-grid{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:650px){
  .shell{width:min(100% - 28px,1180px)}
  .header-inner{height:70px}
  .hero{padding:56px 0}
  h1{font-size:52px}
  h2{font-size:40px}
  .section{padding:66px 0}
  .photo-mat{min-height:320px;padding:20px}
  .page-hero-media,.page-hero-media img{min-height:320px;height:320px}
  .activity-grid,.product-grid,.use-grid,.steps-grid,.process-strip,.product-info-grid,.story-grid,.zones-grid,.faq-layout,.contact-grid,.three-values{grid-template-columns:1fr}
  .section-heading{display:block}
  .order-inline{grid-template-columns:1fr}
  .product-detail-media{min-height:420px}
  .product-detail-media img{height:360px}
  .footer-grid{grid-template-columns:1fr}
  .footer-bottom{display:block}
  .footer-bottom span{display:block;margin-top:6px}
}

/* KEMIT MOTION V1 — HumbleClient-inspired */
.site-header{
  transition:
    background-color .22s ease,
    box-shadow .22s ease,
    border-color .22s ease;
}
.header-inner{transition:height .22s ease}
.site-header.is-scrolled{
  background:rgba(251,250,246,.97);
  border-bottom-color:rgba(13,59,46,.13);
  box-shadow:0 12px 35px rgba(10,39,30,.08);
}
.site-header.is-scrolled .header-inner{height:70px}

.main-nav a,
.text-link,
.card-link{
  transition:color .2s ease,opacity .2s ease,transform .2s ease;
}
.text-link,.card-link{display:inline-flex;align-items:center}
.text-link:hover,.card-link:hover{transform:translateX(3px)}

.btn,.header-cta{
  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background-color .2s ease,
    border-color .2s ease,
    color .2s ease;
}
.btn:hover,.header-cta:hover{transform:translateY(-2px)}
.btn:active,.header-cta:active{transform:translateY(0)}

.activity-card,
.product-card,
.use-card,
.contact-card,
.faq-group,
.small-photo-feature,
.graphic-panel{
  transition:
    transform .28s cubic-bezier(.2,.75,.25,1),
    box-shadow .28s ease,
    border-color .28s ease;
}
.activity-card:hover,
.product-card:hover,
.use-card:hover,
.contact-card:hover{
  transform:translateY(-6px);
  box-shadow:0 24px 55px rgba(10,39,30,.12);
}
.activity-card img,
.product-card-media img,
.small-photo-feature img,
.page-hero-media img,
.product-detail-media img,
.scene-media img{
  transition:transform .65s cubic-bezier(.2,.75,.25,1);
  transform-origin:center;
}
.activity-card:hover img,
.product-card:hover .product-card-media img,
.small-photo-feature:hover img{
  transform:scale(1.035);
}

@media (prefers-reduced-motion:no-preference){
  .motion-ready .reveal-item{
    opacity:0;
    transform:translate3d(0,24px,0);
    transition:
      opacity .7s cubic-bezier(.2,.75,.25,1) var(--reveal-delay,0ms),
      transform .7s cubic-bezier(.2,.75,.25,1) var(--reveal-delay,0ms);
    will-change:opacity,transform;
  }
  .motion-ready .reveal-item.reveal-left{transform:translate3d(-28px,0,0)}
  .motion-ready .reveal-item.reveal-right{transform:translate3d(28px,0,0)}
  .motion-ready .reveal-item.reveal-scale{transform:scale(.975)}
  .motion-ready .reveal-item.is-visible{
    opacity:1;
    transform:translate3d(0,0,0) scale(1);
    will-change:auto;
  }
  .motion-ready .app-page.is-active{
    animation:kemitPageIn .32s ease both;
  }
  @keyframes kemitPageIn{
    from{opacity:.35}
    to{opacity:1}
  }
}

@media(max-width:650px){
  .site-header.is-scrolled .header-inner{height:64px}
  .activity-card:hover,
  .product-card:hover,
  .use-card:hover,
  .contact-card:hover{transform:none}
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}


/* KEMIT VISUAL + MOTION V2 */
:root{
  --emerald:#0f9f67;--emerald-deep:#08714f;--leaf:#53b96d;--lime:#b8d83f;
  --sun:#f1b84b;--clay:#dd6b3f;--aqua:#56c7ab;--charcoal:#10241c;
  --accent-gradient:linear-gradient(135deg,#08714f 0%,#12a36d 52%,#a8ce3e 100%);
  --warm-gradient:linear-gradient(135deg,#f2bf4f 0%,#dd6b3f 100%);
}
body{background:radial-gradient(circle at 12% 4%,rgba(15,159,103,.055),transparent 24%),radial-gradient(circle at 88% 18%,rgba(241,184,75,.05),transparent 22%),var(--paper)}
.eyebrow,.mini-label{width:max-content;max-width:100%;display:inline-flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid rgba(15,159,103,.14);border-radius:999px;background:rgba(15,159,103,.065);color:var(--emerald-deep)}
.eyebrow::before,.mini-label::before{content:"";width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--lime);box-shadow:0 0 0 5px rgba(184,216,63,.11)}
.eyebrow.light{color:#d8efe6;border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.07)}
.eyebrow.light::before{background:var(--sun);box-shadow:0 0 0 5px rgba(241,184,75,.12)}
.hero{position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 8% 12%,rgba(15,159,103,.16),transparent 29%),radial-gradient(circle at 92% 8%,rgba(241,184,75,.16),transparent 24%),linear-gradient(180deg,#fbfaf5 0%,#f7f7ef 100%)}
.hero::before{content:"";position:absolute;z-index:-1;width:520px;height:520px;right:-210px;bottom:-250px;border-radius:50%;background:rgba(184,216,63,.18);filter:blur(100px)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.22;background-image:radial-gradient(rgba(13,59,46,.22) .8px,transparent .8px);background-size:22px 22px;mask-image:linear-gradient(90deg,transparent 0%,black 38%,black 100%)}
.hero h1{color:transparent;background:linear-gradient(100deg,#12372b 0%,#0a6d4e 58%,#69932f 100%);-webkit-background-clip:text;background-clip:text}
.hero-meta span{padding:8px 10px;border:1px solid rgba(13,59,46,.10);border-radius:999px;background:rgba(255,255,255,.58)}
.page-hero{--page-accent:15,159,103;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 12% 0%,rgba(var(--page-accent),.14),transparent 30%),radial-gradient(circle at 92% 12%,rgba(241,184,75,.14),transparent 24%),linear-gradient(180deg,#faf9f4 0%,#f6f6ee 100%)}
.page-hero::before{content:"";position:absolute;z-index:-1;width:440px;height:440px;top:-250px;right:-120px;border-radius:50%;background:rgba(var(--page-accent),.18);filter:blur(100px)}
.page-hero::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.18;background-image:linear-gradient(rgba(13,59,46,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(13,59,46,.08) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,black,transparent 88%)}
.app-page[data-page="boutique"] .page-hero{--page-accent:221,107,63}

/* KEMIT MOTION V4 — material flow, circular energy, stronger page-wide motion */

/* Flux matière → transformation → énergie : fil conducteur sur toutes les pages */
.section.motion-section{
  position:relative;
  isolation:isolate;
  overflow:hidden;
}
.section.motion-section>.shell{position:relative;z-index:1}
.section.motion-section::after{
  content:"";
  position:absolute;
  z-index:0;
  left:max(10px,calc((100% - 1180px)/2 - 22px));
  top:12%;
  width:2px;
  height:76%;
  border-radius:999px;
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    rgba(var(--motion-accent-rgb),.06),
    rgba(var(--motion-accent-rgb),.85),
    rgba(241,184,75,.78),
    rgba(var(--motion-accent-rgb),.06)
  );
  transform:scaleY(max(.08,var(--motion-section-progress,.08)));
  transform-origin:top center;
  box-shadow:0 0 16px rgba(var(--motion-accent-rgb),.15);
  opacity:.75;
  transition:transform .12s linear;
}
.section.motion-section:nth-of-type(even)::after{
  left:auto;
  right:max(10px,calc((100% - 1180px)/2 - 22px));
  background:linear-gradient(
    to bottom,
    rgba(241,184,75,.05),
    rgba(241,184,75,.82),
    rgba(var(--motion-accent-rgb),.78),
    rgba(241,184,75,.05)
  );
}
.dark-band.motion-section::after{opacity:.38}

/* Titres : croissance progressive comme une ligne de transformation */
.section-heading h2::after,
.editorial-copy h2::after,
.home-story h2::after{
  content:"";
  display:block;
  width:min(110px,28%);
  height:3px;
  margin-top:16px;
  border-radius:999px;
  background:linear-gradient(90deg,var(--emerald),var(--lime),var(--sun));
  transform:scaleX(0);
  transform-origin:left center;
  transition:transform .9s cubic-bezier(.16,.78,.24,1) .18s;
  box-shadow:0 0 18px rgba(15,159,103,.16);

.section-heading>div.is-visible h2::after,
.editorial-copy.is-visible h2::after,
.home-story>div.is-visible h2::after{

}

  <script>
    // Fetch the active route's lead visual before the rest of the SPA parses.
    (function () {
      var hashRoute = window.location.hash.replace(/^#/, "").split("/")[0];
      // Apps Script's sandbox URL may not carry the original ?page=... query.
      // Use the initial route provided by doGet to preload the correct hero.
      var route = hashRoute || "<?= initialRoute ?>".split("/")[0] || "home";
      var key = ({
        home: "media-home-team",
        boutique: "product-montage",
        professionnels: "pro-hero-kikimouh",
        "savoir-faire": "savoir-faire-hero-reno",
        histoire: "photo-team-history",
        livraison: "photo-delivery"
      })[route];
      var url = key && window.KEMIT_MEDIA && window.KEMIT_MEDIA[key];
      if (!url) return;
      var link = document.createElement("link");
      link.rel = "preload";
      link.as = "image";
      link.href = url;
      link.setAttribute("fetchpriority", "high");
      document.head.appendChild(link);
    })();
  </script>
</head>

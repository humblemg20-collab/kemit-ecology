<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d3b2e">
  <meta name="robots" content="noindex,follow">
  <title>KEMIT ECOLOGY</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#f7f8f4;overflow:hidden}
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    #kemit-frame{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#f7f8f4}
    #kemit-loading{position:fixed;inset:0;display:grid;place-items:center;background:#f7f8f4;color:#0d3b2e;font-weight:600}
    #kemit-loading[hidden]{display:none}
    #kemit-help{position:fixed;bottom:10px;right:10px;background:rgba(255,255,255,.96);padding:5px 9px;border-radius:9px;font-size:12px;box-shadow:0 2px 12px #0002}
    #kemit-help a{color:#0d3b2e}
    #kemit-help:not([open]){opacity:.42}
    #kemit-help summary{cursor:pointer}
  </style>
</head>
<body>
  <iframe id="kemit-frame" title="Site KEMIT ECOLOGY" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div id="kemit-loading" role="status">Chargement de KEMIT ECOLOGY…</div>
  <details id="kemit-help">
    <summary>Problème d’affichage ?</summary>
    <a id="kemit-fallback" href="#" target="_blank" rel="noopener noreferrer">Ouvrir le site directement</a>
  </details>
  <noscript>JavaScript est nécessaire pour afficher KEMIT ECOLOGY.</noscript>
  <script>
  (function(){
    "use strict";
    var APP_URL="https://script.google.com/macros/s/AKfycbxhDi7r36C60jVcPVQHBXvpzsap3qAWAUHw7OFfSXOfy_HEpDPxeoMzS8TL4e-RImWk/exec";
    var PAGES=["home","boutique","professionnels","savoir-faire","histoire","livraison","faq","contact"];
    var TITLE={home:"KEMIT ECOLOGY",boutique:"Boutique",professionnels:"Professionnels",
      "savoir-faire":"Savoir-faire",histoire:"Notre histoire",livraison:"Livraison",
      faq:"Questions fréquentes",contact:"Contact",produit:"Produit"};
    var frame=document.getElementById("kemit-frame");
    var loading=document.getElementById("kemit-loading");
    var fallback=document.getElementById("kemit-fallback");

    function normalizeRoute(value){
      var route=String(value||"").replace(/^\/+|\/+$/g,"").replace(/\/+/g,"/");
      if(!route||route==="index.html")return "home";
      var parts=route.split("/");
      if(parts[0]==="produit" && parts.length===2 && /^[a-z0-9-]{1,80}$/.test(parts[1])){
        return "produit/"+parts[1];
      }
      return parts.length===1 && PAGES.indexOf(parts[0])!==-1 ? parts[0] : "home";
    }
    function routeFromPath(){
      try{return normalizeRoute(decodeURIComponent(location.pathname));}
      catch(error){return "home";}
    }
    function publicPath(route){return route==="home"?"/":"/"+route;}
    function appUrl(route){
      var url=new URL(APP_URL);
      var pieces=route.split("/");
      if(pieces[0]==="produit"){
        url.searchParams.set("page","produit");
        url.searchParams.set("id",pieces[1]);
      }else{
        url.searchParams.set("page",route);
      }
      return url.href;
    }
    function setPageTitle(route){
      var type=route.split("/")[0];
      document.title=(TITLE[type]||"KEMIT ECOLOGY")+" | KEMIT ECOLOGY";
    }
    function updateFrame(route){
      loading.hidden=false;
      setPageTitle(route);
      var url=appUrl(route);
      fallback.href=url;
      frame.src=url;
    }
    function trustedGoogleOrigin(origin){
      try{
        var url=new URL(origin);
        var host=url.hostname.toLowerCase();
        return url.protocol==="https:" && (
          host==="script.google.com" ||
          host==="script.googleusercontent.com" ||
          host.endsWith(".script.googleusercontent.com") ||
          host.endsWith("-script.googleusercontent.com")
        );
      }catch(error){return false;}
    }
    var current=routeFromPath();
    if(location.pathname!==publicPath(current)){
      history.replaceState({kemitRoute:current},"",publicPath(current));
    }
    frame.addEventListener("load",function(){loading.hidden=true;});
    updateFrame(current);

    // Apps Script posts its internal route so branded paths follow site navigation.
    window.addEventListener("message",function(event){
      if(!trustedGoogleOrigin(event.origin))return;
      var message=event.data;
      if(!message||message.type!=="KEMIT_ROUTE_CHANGED"||typeof message.route!=="string")return;
      var route=normalizeRoute(message.route);
      if(route==="home" && message.route!=="home")return;
      if(route!==current){
        current=route;
        history.pushState({kemitRoute:route},"",publicPath(route));
      }
      setPageTitle(route);
    });

    // Restores the correct page on browser Back/Forward and on deep links.
    window.addEventListener("popstate",function(){
      var route=routeFromPath();
      if(route!==current){
        current=route;
        updateFrame(route);
      }
    });
  }());
  </script>
</body>
</html>

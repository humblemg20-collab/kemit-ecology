<style>/* KEMIT CONVERSION V2 — existing design system, two commercial journeys */
[hidden]{display:none!important}
html{scroll-padding-top:100px}
.home-sales-hero h1{font-size:clamp(44px,5.4vw,78px);line-height:1.02;letter-spacing:-.055em}
.home-sales-hero .hero-lead{max-width:640px}
.home-proof-grid,.home-category-grid,.professional-use-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.home-proof-card{margin:0;border-radius:23px;overflow:hidden;background:var(--cream);border:1px solid var(--line)}
.home-proof-card img{width:100%;height:240px;object-fit:cover}
.home-proof-card figcaption{padding:17px 20px;font-weight:750;font-size:14px}
.home-action-carousel{position:relative;overflow:hidden;margin-top:54px;padding:0 0 8px;mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%)}
.home-action-track{display:flex;width:max-content;gap:16px;animation:kemitActionMarquee 46s linear infinite}
.home-action-carousel:hover .home-action-track,.home-action-carousel:focus-within .home-action-track{animation-play-state:paused}
.home-action-sequence{display:flex;gap:16px;flex:0 0 auto}
.home-action-slide{position:relative;flex:0 0 clamp(260px,27vw,360px);aspect-ratio:1.18/1;margin:0;overflow:hidden;background:var(--carbon,#1a1a1a);border:1px solid rgba(255,255,255,.2)}
.home-action-slide img{width:100%;height:100%;object-fit:cover;filter:grayscale(.12) contrast(1.03);transition:transform .5s ease,filter .5s ease}
.home-action-slide:hover img{transform:scale(1.045);filter:grayscale(0) contrast(1.05)}
.home-action-slide figcaption{position:absolute;left:14px;right:14px;bottom:14px;width:max-content;max-width:calc(100% - 28px);padding:8px 11px;background:rgba(8,8,8,.82);color:var(--white);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
@keyframes kemitActionMarquee{from{transform:translate3d(0,0,0)}to{transform:translate3d(calc(-50% - 8px),0,0)}}
.home-category-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.home-category-card{display:flex;flex-direction:column;min-height:275px;padding:0 24px 24px;border:1px solid var(--line);border-radius:23px;background:var(--paper);transition:box-shadow .2s ease,transform .2s ease;overflow:hidden}
.home-category-media{height:150px;margin:0 -24px 22px;overflow:hidden;background:#e9eee7}
.home-category-media img{width:100%;height:100%;object-fit:cover;transition:transform .35s ease}
.home-category-card:hover .home-category-media img{transform:scale(1.045)}
.home-category-card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.home-category-card span,.professional-use-card span{font-size:11px;color:var(--green2);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.home-category-card h3{margin:23px 0 10px;font-size:clamp(22px,2vw,29px)}
.home-category-card p{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 20px}
.home-category-card strong{margin-top:auto;color:var(--green);font-size:13px}
.home-category-actions{display:flex;justify-content:center;margin-top:26px}
.home-journey-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.home-journey-card{display:flex;flex-direction:column;align-items:flex-start;min-height:390px;padding:36px;border-radius:28px;background:var(--cream)}
.home-journey-card.has-image{position:relative;isolation:isolate;overflow:hidden}
.home-journey-media{position:absolute;inset:0;z-index:0;background:var(--carbon,#1a1a1a)}
.home-journey-media img{width:100%;height:100%;object-fit:cover;filter:grayscale(.08) contrast(1.04);transition:transform .55s ease,filter .55s ease}
.home-journey-card:hover .home-journey-media img{transform:scale(1.035);filter:grayscale(0) contrast(1.06)}
.home-journey-card.has-image::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(115deg,rgba(8,8,8,.94) 0%,rgba(8,8,8,.76) 48%,rgba(8,8,8,.42) 100%);pointer-events:none}
.home-journey-card.is-professional.has-image::after{background:linear-gradient(115deg,rgba(255,255,255,.96) 0%,rgba(255,255,255,.91) 48%,rgba(255,255,255,.84) 100%)}
.home-journey-content{position:relative;z-index:2;display:flex;flex:1;flex-direction:column;width:100%}
.home-journey-card.has-image:not(.is-professional),.home-journey-card.has-image:not(.is-professional) h3{color:var(--white)}
.home-journey-card.has-image:not(.is-professional) .eyebrow{color:var(--silver,#d9d9d9);border-color:rgba(255,255,255,.32)}
.home-journey-card.has-image:not(.is-professional) ol{color:var(--silver,#d9d9d9)}
.home-journey-card.is-professional.has-image,.home-journey-card.is-professional.has-image h3{color:var(--obsidian)}
.home-journey-card.is-professional.has-image ol{color:var(--graphite,#363636)}
.home-journey-card.is-professional{background:var(--green);color:#fff}
.home-journey-card.is-professional .eyebrow{color:#c2dfcc}
.home-journey-card h3{font-size:clamp(28px,3vw,42px);margin:14px 0 20px;line-height:1.08;max-width:500px}
.home-journey-card ol{padding-left:22px;margin:0 0 26px;color:var(--muted);font-size:14px;line-height:1.9}
.home-journey-card.is-professional ol{color:#d7e8dd}
.home-journey-card .btn{margin-top:auto}
.home-assurance-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.home-assurance-grid article{padding:25px;border:1px solid var(--line);border-radius:22px}
.home-assurance-grid span{color:var(--green2);font-weight:700;font-size:12px}
.home-assurance-grid h3{margin:18px 0 10px;font-size:24px}
.home-assurance-grid p{font-size:13px;color:var(--muted);line-height:1.7}
.home-trust-gallery{position:relative;overflow:hidden;margin-top:54px;padding:0 0 8px;mask-image:linear-gradient(90deg,transparent 0,#000 3%,#000 97%,transparent 100%)}
.home-trust-track{display:flex;width:max-content;gap:16px;animation:kemitTrustMarquee 52s linear infinite}
.home-trust-gallery:hover .home-trust-track,.home-trust-gallery:focus-within .home-trust-track{animation-play-state:paused}
.home-trust-sequence{display:flex;gap:16px;flex:0 0 auto}
.home-trust-slide{position:relative;flex:0 0 clamp(220px,20vw,290px);aspect-ratio:4/5;margin:0;overflow:hidden;background:var(--carbon,#1a1a1a);border:1px solid var(--line)}
.home-trust-slide img{width:100%;height:100%;object-fit:cover;filter:saturate(.92) contrast(1.02);transition:transform .5s ease,filter .5s ease}
.home-trust-slide:hover img{transform:scale(1.045);filter:saturate(1.08) contrast(1.05)}
.home-trust-slide figcaption{position:absolute;left:14px;right:14px;bottom:14px;width:max-content;max-width:calc(100% - 28px);padding:8px 11px;background:rgba(8,8,8,.82);color:var(--white);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
@keyframes kemitTrustMarquee{from{transform:translate3d(0,0,0)}to{transform:translate3d(calc(-50% - 8px),0,0)}}
.home-support-links{display:flex;flex-wrap:wrap;gap:18px;margin-top:26px}
.home-support-links .text-link{margin-top:0}
.home-dark-secondary{border-color:rgba(255,255,255,.8);color:#fff}
.home-dark-secondary:hover{background:rgba(255,255,255,.12)}
.boutique-sales-hero h1{font-size:clamp(49px,6vw,78px)}
.boutique-sales-hero .hero-actions{margin-top:28px}
.boutique-sales-hero .hero-meta{margin-top:25px}
.boutique-conversion-strip{padding-top:0;background:var(--paper)}
.boutique-conversion-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.boutique-conversion-grid article{padding:24px;border-top:2px solid var(--green2);background:#fff}
.boutique-conversion-grid article:nth-child(2){border-color:#dd6b3f}
.boutique-conversion-grid article:nth-child(3){border-color:#d89c2d}
.boutique-conversion-grid span{color:var(--green2);font-size:11px;font-weight:800;letter-spacing:.1em}
.boutique-conversion-grid h2{font-size:28px;margin:20px 0 10px}
.boutique-conversion-grid p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
.boutique-fast-catalog .catalog-toolbar{margin-top:54px}
.catalog-disclaimer{margin:22px 0 0;color:var(--muted);font-size:12px;line-height:1.7}
.product-card-outcome{margin:0 0 7px!important;color:var(--green)!important;font:600 16px/1.25 Georgia,serif!important;letter-spacing:-.015em}
.product-card-description{margin:0!important}
.product-outcome{margin:17px 0 0;color:var(--green);font:600 20px/1.3 Georgia,serif;max-width:560px}
.product-info-heading>p{max-width:390px;color:var(--muted);line-height:1.7}
.product-info-grid+.btn{margin-top:28px}
.craft-hero .hero-actions{margin-top:28px}
.craft-cta .hero-actions{justify-content:flex-start}
.product-media-placeholder,.product-photo-unavailable{min-height:240px;width:100%;height:100%;display:flex;justify-content:center;align-items:center;flex-direction:column;gap:12px;text-align:center;padding:26px;background:linear-gradient(135deg,#e9eee7,#f6f4ec);color:var(--green);font-size:12px}
.product-photo-unavailable{min-height:400px}
.product-photo-unavailable strong{max-width:240px;font:500 23px/1.2 Georgia,serif}
.professional-hero h1{font-size:clamp(47px,5.9vw,80px);line-height:1}
.professional-hero .btn{margin-top:12px}
.professional-fineprint{font-size:12px!important}
.professional-use-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.professional-use-card{padding:24px;border-radius:22px;border:1px solid var(--line);background:var(--paper)}
.professional-use-card h3{font-size:24px;margin:20px 0 10px}
.professional-use-card p{font-size:13px;line-height:1.7;color:var(--muted)}
.professional-form-layout{display:grid;grid-template-columns:.9fr 1.1fr;gap:65px;align-items:start}
.professional-form-copy h2{max-width:480px}
.professional-form-copy>p{max-width:450px;line-height:1.75;color:var(--muted)}
.professional-steps{margin-top:30px}
.professional-steps p{margin:12px 0;color:var(--green);line-height:1.6}
.professional-request-form{padding:32px;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}
.professional-field{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
.professional-field label{font-size:12px;font-weight:750;color:var(--green)}
.professional-field input,.professional-field select,.professional-field textarea{width:100%;min-width:0;border:1px solid #cdd8cf;border-radius:13px;padding:13px 14px;font:inherit;font-size:14px;background:var(--paper);color:var(--ink)}
.professional-field textarea{resize:vertical}
.professional-field input:focus,.professional-field select:focus,.professional-field textarea:focus{border-color:var(--green2);outline:2px solid rgba(30,100,78,.13)}
.professional-field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.professional-form-note{color:var(--muted);font-size:11px;line-height:1.65;margin:14px 0 0}
.professional-close{align-items:center}
.professional-close .btn{margin-top:14px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #4d9470;outline-offset:3px}
@media(max-width:1080px){.home-category-grid,.professional-use-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:850px){.home-proof-grid,.home-assurance-grid{grid-template-columns:1fr 1fr}.professional-form-layout{grid-template-columns:1fr;gap:32px}.home-journey-card{min-height:auto}}
@media(max-width:650px){
  .home-sales-hero h1{font-size:clamp(41px,10vw,60px)}
  .home-proof-grid,.home-category-grid,.home-journey-grid,.home-assurance-grid,.professional-use-grid,.professional-field-grid{grid-template-columns:1fr}
  .home-proof-card img{height:220px}
  .home-action-slide{flex-basis:78vw}
  .home-action-carousel{margin-top:34px}
  .home-trust-slide{flex-basis:72vw}
  .home-trust-gallery{margin-top:34px}
  .home-category-card{min-height:210px}
  .home-journey-card{padding:26px}
  .boutique-conversion-grid{grid-template-columns:1fr}
  .boutique-sales-hero .hero-actions{width:100%}
  .boutique-sales-hero .hero-actions .btn{width:100%}
  .professional-request-form{padding:22px}
  .home-sales-hero .hero-actions,.home-journey-card .btn{width:100%}
  .home-sales-hero .hero-actions .btn{width:100%}
}


.kemit-photo-fallback{display:flex;align-items:center;justify-content:center;text-align:center;min-height:210px;width:100%;padding:20px;background:linear-gradient(135deg,#e4ece4,#f7f4eb);color:var(--green);font-size:13px;font-weight:750}
.photo-mat>.kemit-photo-fallback{min-height:300px;border-radius:22px;background:rgba(255,255,255,.9)}
.activity-card.with-photo>.kemit-photo-fallback{min-height:210px}
.page-hero-media>.kemit-photo-fallback{min-height:430px}


/* Seven user-supplied KEMIT photos. Preserve the original URLs and original image proportions. */
.kemit-gallery-section{background:var(--paper)}
.kemit-gallery-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}
.kemit-gallery-card{position:relative;display:block;isolation:isolate;aspect-ratio:4/5;min-width:0;overflow:hidden;border-radius:22px;margin:0;background:linear-gradient(145deg,#e8f0e9,#f0eadf);border:1px solid var(--line);box-shadow:0 12px 30px rgba(10,39,30,.06)}
.kemit-gallery-card img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s ease}
.kemit-gallery-card.has-loaded img{opacity:1}
.kemit-gallery-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:16px;color:var(--green2);text-align:center}
.kemit-gallery-placeholder span{font:500 35px/1 Georgia,serif}
.kemit-gallery-placeholder small{font-size:11px;letter-spacing:.03em;color:var(--muted)}
.kemit-gallery-card.has-loaded .kemit-gallery-placeholder{display:none}
.kemit-gallery-card figcaption{position:absolute;z-index:2;left:12px;bottom:12px;padding:7px 11px;border-radius:999px;background:rgba(13,59,46,.88);color:#fff;font-size:11px;font-weight:750}
.kemit-gallery-card.is-unavailable{border-style:dashed}
@media(max-width:950px){.kemit-gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.kemit-gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kemit-gallery-card{border-radius:16px}}
@media(max-width:400px){.kemit-gallery-grid{grid-template-columns:1fr 1fr;gap:9px}.kemit-gallery-card figcaption{font-size:10px}}

/* ULTIMATE PREMIUM REDESIGN — obsidian / graphite / ivory system */
:root{
  --green:#080808;--green2:#363636;--green3:#858585;--cream:#f5f5f3;--paper:#f5f5f3;
  --ink:#080808;--muted:#5e5e5e;--line:#d9d9d9;--white:#fff;
  --shadow:0 24px 80px rgba(8,8,8,.12);--radius:0;--obsidian:#080808;--carbon:#1a1a1a;
}
html{background:var(--ivory,#f5f5f3);scroll-behavior:smooth}
body{background:var(--cream);color:var(--obsidian);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.site-header{background:rgba(245,245,243,.94);border-bottom:1px solid rgba(8,8,8,.14);backdrop-filter:blur(18px)}
.header-inner{height:76px}
.brand-copy strong,.brand-copy small{color:var(--obsidian)}
.brand-copy small{color:var(--steel,#858585)}
.brand-mark{border-radius:0;background:var(--obsidian);color:var(--white)}
.brand-logo{filter:grayscale(1) contrast(1.15)}
.main-nav{gap:24px}
.main-nav a{color:var(--steel,#858585);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.main-nav a:hover,.main-nav a.is-current{color:var(--obsidian)}
.header-cta,.btn{border-radius:0;letter-spacing:.08em;text-transform:uppercase;font-size:10px;min-height:44px;padding:13px 18px}
.header-cta,.btn-primary{background:var(--obsidian);color:var(--white)}
.header-cta:hover,.btn-primary:hover{background:var(--graphite,#363636)}
.btn-ghost,.btn-outline{border-color:var(--obsidian);color:var(--obsidian);background:transparent}
.btn-light{background:var(--white);color:var(--obsidian)}
.btn-ghost:hover,.btn-outline:hover{background:var(--obsidian);color:var(--white)}
.nav-toggle span{background:var(--obsidian)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;color:var(--obsidian)}
h1{letter-spacing:-.075em}h2{letter-spacing:-.06em}
.eyebrow,.mini-label{border-radius:0;border-color:rgba(8,8,8,.16);background:transparent;color:var(--graphite,#363636);letter-spacing:.16em}
.eyebrow::before,.mini-label::before{background:var(--obsidian);box-shadow:none;border-radius:0}
.hero{padding:0;min-height:calc(100vh - 76px);display:grid;align-items:center;background:var(--obsidian);color:var(--white)}
.home-cinematic-hero{overflow:hidden;isolation:isolate;position:relative}
.home-cinematic-hero::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,rgba(8,8,8,.98) 0%,rgba(8,8,8,.87) 48%,rgba(8,8,8,.32) 100%)}
.home-cinematic-hero::after{content:"";position:absolute;inset:0;z-index:-3;background:linear-gradient(135deg,#080808 0%,#1a1a1a 52%,#363636 100%)}
.home-cinematic-hero .shell{width:min(1320px,calc(100% - 48px));position:relative;z-index:1}
.home-cinematic-hero .hero-grid{grid-template-columns:1.08fr .92fr;gap:58px;min-height:calc(100vh - 76px)}
.home-cinematic-hero .hero-copy{padding:80px 0}
.home-cinematic-hero .eyebrow{color:var(--silver,#d9d9d9);border-color:rgba(255,255,255,.25)}
.home-cinematic-hero .eyebrow::before{background:var(--white)}
.home-cinematic-hero h1{color:var(--white);font-size:clamp(42px,5.4vw,72px);line-height:.96;max-width:700px;letter-spacing:-.055em}
.home-cinematic-hero h1 em{font-style:normal;color:var(--silver,#d9d9d9)}
.home-cinematic-hero .hero-lead{color:var(--silver,#d9d9d9);max-width:610px}
.home-cinematic-hero .btn-ghost{border-color:rgba(255,255,255,.8);color:var(--white)}
.home-cinematic-hero .btn-ghost:hover{background:var(--white);color:var(--obsidian)}
.home-cinematic-hero .hero-meta{color:var(--silver,#d9d9d9);border-top:1px solid rgba(255,255,255,.2);padding-top:18px}
.home-cinematic-hero .hero-meta span{border:0;padding:0;background:none}
.home-cinematic-hero .photo-mat{min-height:590px;border-radius:0;background:var(--graphite,#363636);padding:18px;box-shadow:none;transform:rotate(2deg)}
.home-cinematic-hero .photo-mat::after{content:"KEMIT / 2026";position:absolute;left:28px;bottom:25px;color:rgba(255,255,255,.65);font:10px/1 Inter,sans-serif;letter-spacing:.18em}
.home-cinematic-hero .photo-mat img{width:100%;height:590px;border-radius:0;box-shadow:none;object-fit:cover;filter:grayscale(.15) contrast(1.04)}
.home-cinematic-hero .small-photo-feature figcaption{border-radius:0;background:var(--ivory,#f5f5f3);color:var(--obsidian);box-shadow:none;width:84%;margin:-44px 0 0 8%;padding:18px 20px}
.home-cinematic-hero .small-photo-feature figcaption span{color:var(--steel,#858585)}
.home-cinematic-hero .hero-scroll-note{display:flex;align-items:center;gap:12px;margin-top:54px;color:var(--silver,#d9d9d9)}
.home-scroll-note span,.hero-scroll-note span{display:block;width:1px;height:42px;background:var(--white);opacity:.65}
.hero-scroll-note small{font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.section{padding:112px 0}.section-light{background:var(--white)}.section-cream{background:var(--cream)}
.section-heading{margin-bottom:54px}.section-heading>p{color:var(--steel,#858585)}
.home-proof-card,.home-category-card,.home-journey-card,.home-assurance-grid article,.professional-use-card,.product-card,.contact-card,.steps-grid article,.story-grid article,.zones-grid article,.product-info-grid article{border-radius:0;border-color:var(--line);box-shadow:none}
.home-proof-card{background:var(--ivory,#f5f5f3)}
.home-proof-card figcaption{font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.home-category-card{background:var(--white);min-height:300px}
.home-category-card:hover{box-shadow:0 18px 50px rgba(8,8,8,.12);transform:translateY(-4px)}
.home-category-card span,.professional-use-card span,.home-assurance-grid span{color:var(--steel,#858585)}
.home-category-card strong{color:var(--obsidian)}
.home-journey-card{background:var(--obsidian);color:var(--white);padding:42px}
.home-journey-card.is-professional{background:var(--white);color:var(--obsidian);border:1px solid var(--obsidian)}
.home-journey-card.is-professional .eyebrow{color:var(--graphite,#363636)}
.home-journey-card ol,.home-journey-card.is-professional ol{color:var(--silver,#d9d9d9)}
.home-journey-card.is-professional ol{color:var(--steel,#858585)}
.home-journey-card .btn-light{background:var(--obsidian);color:var(--white)}
.home-assurance-grid article{background:var(--white)}
.home-assurance-grid h3{font-size:26px}
.dark-band,.site-footer{background:var(--obsidian)}
.dark-band p,.site-footer p,.site-footer a{color:var(--silver,#d9d9d9)}
.home-material-section{background:var(--carbon,#1a1a1a);color:var(--white);position:relative;overflow:hidden}

/* Homepage / story: preserve both people and the captions in the original
   two-photo montage. The previous 1:1.1 cover crop cut the image edges. */
.home-team-section .home-team-grid figure {
  background:#f0f4ec;
  overflow:hidden;
}
.home-team-section .home-team-grid figure img {
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:auto;
  max-height:none;
  object-fit:contain;
  object-position:center;
  filter:none;
}

    grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);

  .home-team-section .home-team-grid figure {
    width:100%;

/* Story: display each half of the original composite as a full-width portrait.
   No remote asset replacement; retain the original source and original people. */
.home-team-section .home-story-journey{margin:0;background:transparent;overflow:visible}
.home-team-section .home-story-portraits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.home-team-section .home-story-portrait{
  position:relative;min-width:0;aspect-ratio:3/4.15;overflow:hidden;background:#e4e9df;
}
/* Higher specificity than the generic .home-team-grid figure img rule:
   fill the portrait frame with the corresponding half of the source montage. */
.home-team-section .home-team-grid .home-story-portrait img{
  position:absolute;top:0;left:0;
  width:200%;max-width:none;height:100%;
  aspect-ratio:auto;object-fit:fill;filter:none;display:block;
}
.home-team-section .home-team-grid .home-story-portrait-us img{left:-100%}
.home-team-section .home-story-captions{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px;

  font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.14em;color:#6c826b;
}
